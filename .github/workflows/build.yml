name: Build Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT TOOL & THIẾT LẬP MÔI TRƯỜNG ---
      - name: Setup Environment Variables
        run: |
          THEOS_PATH="$HOME/theos"
          
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          brew install make ldid dpkg coreutils wget curl git xz unzip
          
          # Thêm GNU Make và CoreUtils vào PATH
          echo "/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      # --- BƯỚC 2: CLONE THEOS & TẢI SDK (FIXED FOR DIRECTORY STRUCTURE) ---
      - name: Clone Theos & Install SDK
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          
          echo "📥 Cloning Theos to $TARGET_DIR..."
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"

          echo "📦 Downloading iOS SDK from theos/sdks repository..."
          mkdir -p "$TARGET_DIR/sdks"
          cd "$TARGET_DIR/sdks"

          # Xác định phiên bản SDK muốn tải (Ưu tiên 16.5 cho rootless iOS 15-16)
          # Nếu bạn cần bản khác, hãy sửa tên folder ở đây
          SDK_VERSION="iPhoneOS16.5.sdk"
          
          echo "Targeting SDK: $SDK_VERSION"
          
          # Kiểm tra xem folder đó có tồn tại trên repo không
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/theos/sdks/contents/$SDK_VERSION?ref=master")
            
          if [ "$STATUS_CODE" != "200" ]; then
              echo "❌ Error: Folder '$SDK_VERSION' does not exist in theos/sdks master branch."
              echo "HTTP Status: $STATUS_CODE"
              exit 1
          fi

          echo "✅ Found valid SDK directory. Downloading via Tarball API..."
          
          # Tải nguyên folder SDK dưới dạng tar.gz từ GitHub API
          # Đây là cách chính thức để lấy subfolder từ repo lớn
          curl -L -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/theos/sdks/tarball/master/$SDK_VERSION" \
               -o sdk.tar.gz
               
          echo "📂 Extracting SDK..."
          tar xf sdk.tar.gz
          
          # Sau khi extract, GitHub thường tạo một folder tạm thời như 'theos-sdks-xxxxx/iPhoneOS16.5.sdk'
          # Chúng ta cần di chuyển nó lên đúng vị trí
          TEMP_FOLDER=$(ls -d */ | head -n 1)
          mv "${TEMP_FOLDER}${SDK_VERSION}" .
          rm -rf "$TEMP_FOLDER" sdk.tar.gz
          
          # Kiểm tra kết quả cuối cùng
          if [ ! -d "$SDK_VERSION" ]; then
             echo "❌ Extraction failed or wrong structure."
             ls -la
             exit 1
          fi
          
          echo "✅ SDK Installation Complete."
          du -sh "$SDK_VERSION"

      # --- BƯỚC 3: BUILD PACKAGE ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          # Chạy build
          make clean package FINALPACKAGE=1
          
          ls -lh packages/*.deb || echo "Build finished but no deb found"

      # --- BƯỚC 4: UPLOAD ARTIFACT ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyRootlessTweak.deb
          path: packages/*.deb
