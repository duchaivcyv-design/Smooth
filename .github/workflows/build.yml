name: Build BoostiPhone6s Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT CÔNG CỤ TỐI ƯU TỐC ĐỘ CAO ---
      - name: Setup Tools & Environment
        run: |
          THEOS_PATH="$HOME/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          echo "THEOS_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install dpkg ldid coreutils

      # --- BƯỚC 2: CLONE THEOS & TẢI IPHONEOS 16.5 SDK CHUẨN XÁC ---
      - name: Clone Theos & Install SDK
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$TARGET_DIR"
          
          mkdir -p "$TARGET_DIR/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          rm -rf /tmp/sdks
          
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Không tìm thấy SDK iPhoneOS16.5!"
             exit 1
          fi
          echo "✅ Cài đặt Theos & SDK iPhoneOS16.5 hoàn tất!"

      # --- BƯỚC 3: QUÉT PHÂN TÍCH TĨNH: PHÁT HIỆN CHÍNH XÁC DÒNG CODE GÂY SAFEMODE ---
      - name: Deep Scan Safe Mode Risks & Crash Triggers
        run: |
          python3 - << 'EOF'
          import re
          import sys
          import glob

          files = glob.glob("**/*.xm", recursive=True) + glob.glob("**/*.x", recursive=True) + glob.glob("**/*.m", recursive=True)
          if not files:
              print("⚠️ Không tìm thấy file source nào để quét!")
              sys.exit(0)

          has_critical_error = False
          safemode_patterns = [
              (re.compile(r'\[CADisplay\s+mainDisplay\]'), "Gọi CADisplay trực tiếp ngoài MainThread hoặc trước khi WindowServer khởi động"),
              (re.compile(r'\[UIApp\s+'), "Gọi UIApp trong constructor sớm khi UIApplication chưa sẵn sàng"),
              (re.compile(r'objc_getClass\("([^"]+)"\)\s*(?!;)'), "Gọi objc_getClass không kiểm tra giá trị trả về nil (Nguy cơ Null Pointer Crash)"),
              (re.compile(r'%init\s*\([^)]*\)\s*;'), "Khởi tạo group hook toàn cục dễ gây đụng độ symbol")
          ]

          for filepath in files:
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()

              current_group = "Toàn cục / Ngoài nhóm"
              for idx, raw_line in enumerate(lines, 1):
                  code_line = re.sub(r'//.*$', '', raw_line).strip()
                  
                  group_match = re.match(r'^%group\s+([A-Za-z0-9_]+)', code_line)
                  if group_match:
                      current_group = group_match.group(1)

                  for pat, desc in safemode_patterns:
                      if pat.search(code_line):
                          has_critical_error = True
                          print(f"\n🚨 [PHÁT HIỆN RỦI RO TRONG SOURCE CODE]")
                          print(f"📁 Tệp tin : {filepath}")
                          print(f"📍 Dòng    : {idx} (Thuộc nhóm: {current_group})")
                          print(f"❌ Nguyên nhân: {desc}")
                          print(f"💻 Mã nguồn: {raw_line.strip()}")
                          print("-" * 60)

          if has_critical_error:
              print("\n🛑 PHÁT HIỆN CÁC ĐOẠN CODE TIỀM ẨN GÂY SAFEMODE / CRASH HOẶC TREO TÁO!")
              print("👉 Hãy khắc phục triệt để các vị trí trên trước khi phát hành gói .deb.")
          else:
              print("✅ Quét tĩnh an toàn tuyệt đối: Không phát hiện lỗi cấu trúc rủi ro!")
          EOF

      # --- BƯỚC 4: DỌN DẸP & BIÊN DỊCH SONG SONG ĐA NHÂN ---
      - name: Build Package (Rootless .deb)
        run: |
          cd $GITHUB_WORKSPACE
          
          if ! [ -f Makefile ]; then
            echo "❌ Error: Không tìm thấy Makefile tại thư mục gốc!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          for DEBIAN_DIR in "layout/DEBIAN" "DEBIAN"; do
            if [ -d "$DEBIAN_DIR" ]; then
              find "$DEBIAN_DIR" -type f -exec chmod 644 {} +
              find "$DEBIAN_DIR" -type f \( -name "postinst" -o -name "prerm" -o -name "postrm" -o -name "preinst" \) -exec chmod 755 {} +
              chmod 755 "$DEBIAN_DIR"
            fi
          done
          
          BUILD_LOG_FILE="/tmp/theos_build.log"
          set -o pipefail
          NCPU=$(sysctl -n hw.ncpu || echo 2)
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless -j"$NCPU" 2>&1 | tee "$BUILD_LOG_FILE" || BUILD_FAILED=1

          if [ "$BUILD_FAILED" = "1" ]; then
            echo ""
            echo "======================================================================"
            echo "🚨 BIÊN DỊCH THẤT BẠI! BÁO CÁO CHI TIẾT TỪ TRÌNH BIÊN DỊCH CLANG:"
            echo "======================================================================"
            grep -E '(error:|fatal error:)' "$BUILD_LOG_FILE" || true
            echo ""
            tail -n 60 "$BUILD_LOG_FILE"
            echo "======================================================================"
            exit 1
          fi
          
          ls -lh packages/*.deb || { echo "❌ Không tìm thấy file deb!"; exit 1; }

      # --- BƯỚC 5: TRÍCH XUẤT FILE THÔ, MÔ PHỎNG MÁY ẢO & KIỂM TRA CHUYÊN SÂU (IOS 14 - 26.0.1) ---
      - name: Advanced Sandbox Runtime & Raw File Extraction Check
        run: |
          echo "======================================================================"
          echo "🧪 MÔ PHỎNG MÁY ẢO iOS (14.0 - 26.0.1) & KIỂM TRA LỖI NẠP DYLIB / SAFEMODE"
          echo "======================================================================"
          
          DEB_FILE=$(ls packages/*.deb | head -n 1)
          TEST_DIR="/tmp/deb_extracted_raw"
          rm -rf "$TEST_DIR" && mkdir -p "$TEST_DIR"
          
          # Trích xuất toàn bộ cấu trúc file thô trong gói deb
          dpkg -x "$DEB_FILE" "$TEST_DIR"
          echo "📦 Đã trích xuất toàn bộ cấu trúc file thô (Raw File Tree) tại: $TEST_DIR"
          find "$TEST_DIR" -type f
          
          DYLIB_PATH=$(find "$TEST_DIR" -name "BoostiPhone6sCore.dylib" | head -n 1)
          if [ -z "$DYLIB_PATH" ] || [ ! -f "$DYLIB_PATH" ]; then
            echo "❌ Lỗi trầm trọng: Không tìm thấy tệp BoostiPhone6sCore.dylib trong gói deb!"
            exit 1
          fi

          # Kiểm tra cấu trúc kiến trúc nhị phân (Fat Binary / Slice)
          echo "📊 Thông tin kiến trúc nhị phân Mach-O:"
          lipo -info "$DYLIB_PATH"

          # Kiểm tra các Load Commands (Kiểm soát đường dẫn rpath và framework phụ thuộc)
          echo "🔍 Phân tích Mach-O Load Commands & Frameworks:"
          otool -l "$DYLIB_PATH" | grep -A 3 -E '(LC_LOAD_DYLIB|LC_RPATH)' || true

          # Kiểm tra biểu tượng liên kết (Undefined Symbols Check)
          echo "🔍 Kiểm tra các ký hiệu liên kết ngoài (Undefined Dynamic Symbols):"
          nm -u "$DYLIB_PATH" | grep -v -E '(_objc_|_OBJC_|_dispatch_|_os_|_pthread_|___CFConstantStringClassReference|_notify_|_mach_|_vm_|_setiopolicy_np|_time|_getprogname)' || true

          # Mô phỏng test nạp động (Dynamic Loading Test Harness)
          cat << 'EOF' > /tmp/runtime_simulator.m
          #import <Foundation/Foundation.h>
          #import <dlfcn.h>
          #import <stdio.h>

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  if (argc < 2) return 1;
                  const char *dylibPath = argv[1];
                  printf("🚀 [MÁY ẢO MÔ PHỎNG]: Tiến hành nạp thử dylib: %s\n", dylibPath);
                  
                  void *handle = dlopen(dylibPath, RTLD_NOW | RTLD_GLOBAL);
                  if (!handle) {
                      const char *err = dlerror();
                      printf("🚨 [PHÁT HIỆN NGUY CƠ SAFEMODE / CRASH KHI NẠP]:\n");
                      printf("❌ Nguyên nhân từ dylib: %s\n", err ? err : "Unknown dynamic link error");
                      return 100;
                  }
                  
                  printf("✅ [THÀNH CÔNG]: Dylib nạp vào bộ nhớ hoàn hảo, không gây xung đột hay Safe Mode!\n");
                  dlclose(handle);
                  return 0;
              }
          }
          EOF

          clang -fobjc-arc /tmp/runtime_simulator.m -o /tmp/runtime_simulator -framework Foundation
          
          echo "🏃 Chạy thử nghiệm mô phỏng trên tiến trình ảo..."
          if /tmp/runtime_simulator "$DYLIB_PATH"; then
             echo "✅ Kiểm tra máy ảo thành công: Không có nguy cơ treo táo hay Safe Mode!"
          else
             echo "❌ CẢNH BÁO: Phát hiện bất ổn trong dylib có thể dẫn đến Safe Mode hoặc SREBOOT khi respring!"
             exit 1
          fi

      # --- BƯỚC 6: TẢI GÓI DEB VÀ FILE THÔ LÊN ARTIFACTS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-FullPackage
          path: |
            packages/*.deb
            /tmp/deb_extracted_raw/**/*
          retention-days: 7
