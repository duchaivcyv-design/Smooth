name: Build BoostiPhone6s Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sbingner/theos:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          depth: 1

      - name: Build Package
        run: |
          # Tự động tìm và thiết lập quyền cho file control / script
          find . -name "control" -exec chmod 644 {} +
          for DEBIAN_DIR in "layout/DEBIAN" "DEBIAN"; do
            if [ -d "$DEBIAN_DIR" ]; then
              find "$DEBIAN_DIR" -type f \( -name "postinst" -o -name "prerm" -o -name "postrm" -o -name "preinst" \) -exec chmod 755 {} +
              chmod 755 "$DEBIAN_DIR"
            fi
          done

          # Biên dịch trực tiếp đa nhân, nén gzip cấp 1 nhanh nhất
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            THEOS_PACKAGE_COMPRESSION=gzip \
            -j$(nproc)

          ls -lh packages/*.deb

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-Deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
