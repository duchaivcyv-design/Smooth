      # --- BƯỚC 2.5: KIỂM TOÁN MÃ NGUỒN TOÀN DIỆN, QUYỀN TRUY CẬP ROOTLESS/ROOTHIDE VÀ CODE THIẾU ---
      - name: Full Project Audit & iOS Compatibility Scan
        run: |
          python3 - << 'EOF'
          import os, re, sys

          AUDIT_RULES = [
              # --- 1. LỖI PHÂN QUYỀN VÀ TRUY XUẤT ĐƯỜNG DẪN ROOTLESS / ROOTHIDE ---
              {
                  "pattern": r'(access|open|fopen|chmod|chown)\s*\(\s*\"/var/jb',
                  "guard": None,
                  "category": "RootHide/Rootless Path Crash",
                  "severity": "CRITICAL",
                  "msg": "Hardcode đường dẫn '/var/jb' trong hàm C system call -> Gây crash do phân quyền Sandbox hoặc sai UUID jb-root trên RootHide."
              },
              {
                  "pattern": r'@\"/var/jb/var/mobile/Library/Preferences',
                  "guard": r"Titanium_ResolvePrefPath|Titanium_GetRootHidePrefixPath|jbroot",
                  "category": "RootHide Pref Path",
                  "severity": "CRITICAL",
                  "msg": "Hardcode đường dẫn file Preferences tuyệt đối -> Sẽ không đọc/ghi được cấu hình trên RootHide."
              },
              {
                  "pattern": r'com\.apple\.UIKit',
                  "guard": None,
                  "category": "Filter Plist Over-Inject",
                  "severity": "WARNING",
                  "msg": "Filter chứa 'com.apple.UIKit': Dylib sẽ bị nạp vào toàn bộ app App Store bị kẹp Sandbox chặt chẽ."
              },

              # --- 2. LỖI CRASH KHÔNG TƯƠNG THÍCH PHIÊN BẢN IOS ---
              {
                  "pattern": r"(CAFrameRateRange|setPreferredFrameRateRange:)",
                  "guard": r"@available\s*\(\s*iOS\s*15",
                  "category": "iOS 14 Crash",
                  "severity": "CRITICAL",
                  "msg": "Dùng API CAFrameRateRange nhưng không bọc trong @available(iOS 15.0, *) -> Crash Safe Mode 'Symbol not found' trên iOS 14."
              },
              {
                  "pattern": r"\[self\.layer\s+setCornerCurve:|\.cornerCurve\s*=",
                  "guard": r"respondsToSelector.*cornerCurve",
                  "category": "iOS 12-14 Crash",
                  "severity": "CRITICAL",
                  "msg": "Gán trực tiếp cornerCurve trên CALayer mà không kiểm tra respondsToSelector."
              },

              # --- 3. LỖI HIỆU NĂNG & XUNG ĐỘT GIAO DIỆN ---
              {
                  "pattern": r"\[\w+\s+layoutIfNeeded\]",
                  "guard": None,
                  "category": "Lag Launch/Switcher",
                  "severity": "WARNING",
                  "msg": "Cưỡng ép layout đồng bộ: Làm chậm khởi động app từ 200-500ms và gây giật khung hình khi lướt App Switcher."
              },
              {
                  "pattern": r"(malloc_zone_pressure_relief|_flushSharedImageCache)",
                  "guard": None,
                  "category": "Lag Switcher",
                  "severity": "WARNING",
                  "msg": "Xả RAM đồ họa quá đà: Làm mất bộ đệm snapshot của App Switcher."
              },
              {
                  "pattern": r"MSHookMessageEx",
                  "guard": None,
                  "category": "Xung đột Hooks",
                  "severity": "WARNING",
                  "msg": "Dùng MSHookMessageEx song song với Logos dễ làm hỏng chuỗi con trỏ %orig."
              },

              # --- 4. CÁC TÍNH NĂNG VÀ NHẬN DIỆN PHẦN CỨNG ---
              {
                  "pattern": r"supportsDynamicRefresh",
                  "guard": None,
                  "category": "iOS 15.0+ Only",
                  "severity": "INFO",
                  "msg": "API ProMotion chỉ có trên iOS 15+."
              },
              {
                  "pattern": r"HardwareHasNative120Hz",
                  "guard": None,
                  "category": "Phần cứng 120Hz Native",
                  "severity": "INFO",
                  "msg": "Nhận diện màn hình 120Hz vật lý (iPhone 13 Pro -> 15 Pro Max)."
              },
              {
                  "pattern": r"Titanium_IsClassicHomeButtonDevice",
                  "guard": None,
                  "category": "Phần cứng Nút Home (A9-A11)",
                  "severity": "INFO",
                  "msg": "Phân nhánh xử lý cho iPhone 6s, 7, 7P, 8, 8P, SE."
              },
              {
                  "pattern": r"UIApplicationDidFinishLaunchingNotification",
                  "guard": None,
                  "category": "Cứu hộ Treo Reboot",
                  "severity": "INFO",
                  "msg": "Cơ chế hoãn nạp bảo vệ SpringBoard an toàn khi vừa reboot jailbreak."
              }
          ]

          EXTENSIONS = ('.xm', '.x', '.m', '.mm', '.h', '.c', '.cpp', '.plist')
          EXCLUDED = ('.theos', 'obj', 'packages', '.git')

          files_list = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in EXCLUDED]
              for f in files:
                  if f.endswith(EXTENSIONS) or f in ['Makefile', 'control']:
                      files_list.append(os.path.join(root, f))

          critical_errors = 0
          warnings = 0
          dist_map = {}
          issues = []

          print("🔍 [BƯỚC 1/2] Đang quét toàn bộ file kiểm tra cú pháp và quyền Rootless/RootHide...")

          all_source_code = ""

          for fpath in files_list:
              try:
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                      lines = content.splitlines()

                  if fpath.endswith(('.xm', '.x', '.m', '.mm')):
                      all_source_code += "\n" + content

                  # Kiểm tra cấu trúc đóng/mở Logos
                  if fpath.endswith(('.xm', '.x')):
                      hooks = len(re.findall(r"^\s*%hook\b", content, re.MULTILINE))
                      groups = len(re.findall(r"^\s*%group\b", content, re.MULTILINE))
                      subclasses = len(re.findall(r"^\s*%subclass\b", content, re.MULTILINE))
                      ends = len(re.findall(r"^\s*%end\b", content, re.MULTILINE))
                      required_ends = hooks + groups + subclasses

                      if required_ends != ends:
                          critical_errors += 1
                          issues.append({
                              "file": fpath,
                              "line": 0,
                              "sev": "CRITICAL",
                              "cat": "Lỗi Cú Pháp Logos",
                              "msg": f"Lệch cấu trúc khối: Tìm thấy {hooks} %hook, {groups} %group, {subclasses} %subclass (cần {required_ends} %end), nhưng chỉ có {ends} %end.",
                              "snippet": "Kiểm tra lại toàn bộ các cặp đóng %end."
                          })

                  # Quét chi tiết từng dòng
                  for idx, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if stripped.startswith("//") or stripped.startswith("/*") or stripped.startswith("*"):
                          continue

                      for rule in AUDIT_RULES:
                          if re.search(rule["pattern"], line):
                              cat = rule["category"]
                              if cat not in dist_map:
                                  dist_map[cat] = []
                              dist_map[cat].append(f"{os.path.basename(fpath)}:{idx}")

                              has_guard = False
                              if rule["guard"]:
                                  start_ctx = max(0, idx - 12)
                                  context_lines = "\n".join(lines[start_ctx:idx])
                                  if re.search(rule["guard"], context_lines):
                                      has_guard = True

                              if rule["guard"] and not has_guard:
                                  critical_errors += 1
                                  issues.append({
                                      "file": fpath,
                                      "line": idx,
                                      "sev": "CRITICAL",
                                      "cat": rule["category"],
                                      "msg": rule["msg"],
                                      "snippet": stripped[:80]
                                  })
                              elif not rule["guard"]:
                                  if rule["severity"] == "CRITICAL":
                                      critical_errors += 1
                                  elif rule["severity"] == "WARNING":
                                      warnings += 1

                                  if rule["severity"] in ["CRITICAL", "WARNING"]:
                                      issues.append({
                                          "file": fpath,
                                          "line": idx,
                                          "sev": rule["severity"],
                                          "cat": rule["category"],
                                          "msg": rule["msg"],
                                          "snippet": stripped[:80]
                                      })
              except Exception as e:
                  print(f"Không thể đọc file {fpath}: {e}")

          # --- 2. BẮT LỖI THIẾU CODE / CODE KHÔNG HOẠT ĐỘNG TRONG PROJECT ---
          print("🔍 [BƯỚC 2/2] Đang kiểm tra tính toàn vẹn và các thành phần cốt lõi...")

          # Kiểm tra xem có khai báo Group nhưng quên %init(Group_Name) không
          defined_groups = re.findall(r"^\s*%group\s+([A-Za-z0-9_]+)", all_source_code, re.MULTILINE)
          for grp in set(defined_groups):
              if not re.search(rf"%init\s*\(\s*{grp}\s*\)", all_source_code):
                  warnings += 1
                  issues.append({
                      "file": "Tweak.xm",
                      "line": 0,
                      "sev": "WARNING",
                      "cat": "Thiếu Code Kích Hoạt",
                      "msg": f"Group `{grp}` đã được viết mã nhưng KHÔNG được gọi `%init({grp})` trong %ctor -> Code này sẽ hoàn toàn không hoạt động!",
                      "snippet": f"%group {grp}"
                  })

          # Kiểm tra xem hook CADisplayLink có đầy đủ API để ép tần số quét không
          if "CADisplayLink" in all_source_code:
              if "preferredFramesPerSecond:" not in all_source_code and "setPreferredFramesPerSecond:" not in all_source_code:
                  warnings += 1
                  issues.append({
                      "file": "Tweak.xm",
                      "line": 0,
                      "sev": "WARNING",
                      "cat": "Thiếu Code FPS",
                      "msg": "Có hook CADisplayLink nhưng thiếu method `setPreferredFramesPerSecond:` -> Không thể giới hạn 60fps an toàn.",
                      "snippet": "%hook CADisplayLink"
                  })

          # Kiểm tra file cấu hình .plist
          plist_found = any(f.endswith('.plist') for f in files_list)
          if not plist_found:
              critical_errors += 1
              issues.append({
                  "file": "Project Root",
                  "line": 0,
                  "sev": "CRITICAL",
                  "cat": "Thiếu Tệp Filter",
                  "msg": "Không tìm thấy file .plist bộ lọc bundle (vd: BoostiPhone6sCore.plist) -> Dylib sẽ không biết nạp vào đâu!",
                  "snippet": "Tạo file <TweakName>.plist cùng cấp Makefile"
              })

          # In bảng báo cáo
          print("\n" + "=" * 80)
          print("📊 BÁO CÁO PHÂN PHỐI TÍNH NĂNG & DẢI HỖ TRỢ THEO TỪNG PHIÊN BẢN IOS")
          print("=" * 80)
          for category, occs in sorted(dist_map.items()):
              loc_preview = ", ".join(occs[:6]) + ("..." if len(occs) > 6 else "")
              print(f"👉 \033[1;36m{category:<32}\033[0m : {loc_preview}")

          if issues:
              print("\n" + "=" * 80)
              print("🚨 DANH SÁCH LỖI PHÂN QUYỀN, THIẾU CODE & ĐIỂM NGHẼN CẦN XỬ LÝ")
              print("=" * 80)
              for item in issues:
                  color = "\033[1;31m" if item["sev"] == "CRITICAL" else "\033[1;33m"
                  loc = f"{item['file']}:{item['line']}" if item['line'] > 0 else item['file']
                  print(f"{color}[{item['sev']}] [{item['cat']}] tại {loc}\033[0m")
                  print(f"   Trích đoạn : {item['snippet']}")
                  print(f"   Hướng xử lý: {item['msg']}\n")

          print("=" * 80)
          print(f"TỔNG KẾT: {critical_errors} Lỗi Chí Mạng (Sẽ dừng build) | {warnings} Cảnh Báo Hiệu Năng/Thiếu Code\n")

          if critical_errors > 0:
              print("❌ PHÁT HIỆN LỖI PHÂN QUYỀN HOẶC CÚ PHÁP CÓ THỂ GÂY TREO/CRASH! DỪNG BUILD.")
              sys.exit(1)
          else:
              print("✅ Mã nguồn vượt qua kiểm toán an toàn! Đủ điều kiện build cho iOS 14 -> 16+.")
          EOF
