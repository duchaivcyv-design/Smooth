name: Build Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT TOOL & THIẾT LẬP MÔI TRƯỜNG ---
      - name: Setup Environment Variables
        run: |
          # Định nghĩa đường dẫn Theos
          THEOS_PATH="$HOME/theos"
          
          # Ghi vào GITHUB_ENV để các step sau đọc được
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          # Cài đặt tools cần thiết
          brew install make ldid dpkg coreutils wget curl git xz unzip
      
          # Thêm đường dẫn GNU Make/CoreUtils vào PATH
          echo "/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      # --- BƯỚC 2: CLONE THEOS & TẢI SDK (FIXED) ---
      - name: Clone Theos & Install SDK via Tool
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          
          echo "📥 Cloning Theos to $TARGET_DIR..."
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"

          echo "📦 Installing iOS SDK using Theos built-in tool..."
          
          # Cách 1: Dùng lệnh theos -g sdk (Khuyên dùng nhất)
          # Lệnh này sẽ tự động cập nhật danh sách SDK và tải phiên bản iphoneos mới nhất
          cd "$TARGET_DIR"
          ./bin/theos -g sdk iphoneos || {
              echo "⚠️ Method 1 failed. Trying manual download from latest release..."
              
              # Cách 2 (Fallback): Tải trực tiếp từ trang Releases của theos/sdks
              # Lấy link asset .tar.xz gần nhất
              SDK_URL=$(curl -s https://api.github.com/repos/theos/sdks/releases/latest \
                | grep "browser_download_url.*iphoneos.*\.tar\.xz" \
                | cut -d '"' -f 4 \
                | head -n 1)
              
              if [ -z "$SDK_URL" ]; then
                  echo "❌ Could not find any SDK URL!"
                  exit 1
              fi
              
              echo "Downloading from: $SDK_URL"
              mkdir -p sdks
              cd sdks
              wget -q "$SDK_URL" -O sdk.tar.xz
              tar xf sdk.tar.xz
              rm sdk.tar.xz
          }

          # Kiểm tra xem SDK đã nằm trong thư mục chưa
          ls -la "$TARGET_DIR/sdks/"
          echo "✅ SDK Installation Complete."

      # --- BƯỚC 3: BUILD PACKAGE ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          
          # Clean cache cũ
          rm -rf packages/ obj/ .theos/
          
          # Bắt đầu build
          make clean package FINALPACKAGE=1
          
          # Liệt kê kết quả
          ls -lh packages/*.deb || echo "No deb generated"

      # --- BƯỚC 4: UPLOAD ARTIFACT ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyRootlessTweak.deb
          path: packages/*.deb
