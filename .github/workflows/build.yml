name: Build Rootless Deb & Deploy Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write # Cấp quyền cho GitHub Actions tự push code/Deploy Pages

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT TOOL & THIẾT LẬP MÔI TRƯỜNG ---
      - name: Setup Environment Variables
        run: |
          THEOS_PATH="$HOME/theos"
          
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          brew install make ldid dpkg coreutils wget curl git xz unzip
          
          # Thêm GNU Make và CoreUtils vào PATH
          echo "/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      # --- BƯỚC 2: CLONE THEOS & TẢI SDK ---
      - name: Clone Theos & Install SDK via Git Sparse
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          
          echo "📥 Cloning Theos to $TARGET_DIR..."
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"

          echo "📦 Downloading iOS SDK using Git Sparse-Checkout..."
          
          mkdir -p /tmp/sdk_repo
          cd /tmp/sdk_repo
          
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk/" > .git/info/sparse-checkout
          
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD
          
          mkdir -p "$TARGET_DIR/sdks"
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          
          cd ~
          rm -rf /tmp/sdk_repo
          
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Failed to move SDK."
             exit 1
          fi
          
          echo "✅ SDK Installation Complete."

      # --- BƯỚC 3: BUILD PACKAGE ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          # Chạy build package
          make clean package FINALPACKAGE=1
          
          ls -lh packages/*.deb || echo "Build finished but no deb found"

            # --- BƯỚC 4: TẠO REPO METADATA & THƯ MỤC DEB ---
      - name: Generate Repo Index & Package Metadata
        run: |
          cd $GITHUB_WORKSPACE
          
          # 1. Tạo thư mục deb/ công khai
          mkdir -p deb
          
          # 2. Copy toàn bộ file .deb mới build vào thư mục deb/
          if [ -d "packages" ] && [ "$(ls -A packages/*.deb 2>/dev/null)" ]; then
            cp packages/*.deb deb/
            echo "✅ Copy file .deb vào thư mục deb/ thành công!"
          else
            echo "❌ Không tìm thấy file .deb trong thư mục packages/"
            exit 1
          fi
          
          # 3. Dọn dẹp file danh mục cũ
          rm -rf Packages Packages.bz2 Packages.xz Release
          
          # 4. Tạo file Packages danh sách tweak
          dpkg-scanpackages -m ./deb /dev/null > Packages
          bzip2 -f -k Packages
          xz -f -k Packages
          
          # 5. Tạo file Release chuẩn cho Sileo / Zebra
          cat <<EOF > Release
          Origin: Smooth Repo
          Label: Smooth
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Repo Tweak Smooth iphone 6s-x ios 15-16.7.16
          EOF
          
          # 6. Tạo trang index.html có link tải trực tiếp file .deb
          DEB_FILE=$(ls deb/*.deb | head -n 1)
          DEB_NAME=$(basename "$DEB_FILE")
          
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Smooth Repo</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; text-align: center; padding: 30px 15px; }
                  .card { background: #1c1c1e; padding: 20px; border-radius: 14px; margin: 20px auto; max-width: 360px; border: 1px solid #2c2c2e; }
                  h1 { color: #34c759; font-size: 24px; }
                  p { color: #8e8e93; font-size: 14px; }
                  a.btn { display: block; padding: 12px; background: #007aff; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; margin-top: 15px; }
              </style>
          </head>
          <body>
              <h1>🚀 Smooth Repo</h1>
              <p>Kho Tweak iOS 15 - 16.7.16 (Rootless)</p>
              
              <div class="card">
                  <h2>Boost iPhone 6s-X</h2>
                  <p>Tối ưu hóa hệ thống, tăng tốc CPU/GPU.</p>
                  <a class="btn" href="./deb/$DEB_NAME">⬇️ Tải Trực Tiếp File .DEB</a>
              </div>
          </body>
          </html>
          EOF

      # --- BƯỚC 5: ĐẨY TOÀN BỘ FILE LÊN BRANCH GH-PAGES ---
      - name: Deploy Repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
