name: Build BoostiPhone6s Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT CÔNG CỤ HỖ TRỢ ĐÓNG GÓI ---
      - name: Setup Tools & Environment
        run: |
          THEOS_PATH="$HOME/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          # Cài dpkg và ldid để Theos đóng gói và ký mã deb
          brew install dpkg ldid coreutils

      # --- BƯỚC 2: CLONE THEOS & TẢI IPHONEOS 16.5 SDK ---
      - name: Clone Theos & Install SDK
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"
          
          # Tải nhanh SDK 16.5 bằng sparse-checkout
          mkdir -p /tmp/sdk_repo
          cd /tmp/sdk_repo
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk/" > .git/info/sparse-checkout
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD
          
          mkdir -p "$TARGET_DIR/sdks"
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          cd ~
          rm -rf /tmp/sdk_repo
          
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Không tìm thấy SDK iPhoneOS16.5!"
             exit 1
          fi

      # --- BƯỚC 3: DỌN DẸP VÀ BIÊN DỊCH GÓI DEB ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "❌ Error: Không tìm thấy Makefile tại thư mục gốc!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          # Đảm bảo phân quyền các file thực thi trong layout (nếu có)
          if [ -d "postinst" ]; then chmod 755 postinst; fi
          if [ -d "prerm" ]; then chmod 755 prerm; fi
          
          # Tiến hành build gói deb Rootless
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          
          # Kiểm tra file thành phẩm
          ls -lh packages/*.deb || { 
            echo "❌ Build hoàn tất nhưng không tìm thấy file .deb!"; 
            exit 1; 
          }

      # --- BƯỚC 4: TẢI FILE DEB LÊN ARTIFACTS ---
      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-Deb
          path: packages/*.deb
          retention-days: 7
