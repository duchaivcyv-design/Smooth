name: Instant 5s Deb Packager

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fast-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            layout
            DEBIAN
          depth: 1

      - name: Fast Pack .deb (Zero-Compile)
        run: |
          mkdir -p build_pkg/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p build_pkg/DEBIAN
          mkdir -p packages

          # Sao chép file control & script bảo toàn quyền thực thi
          if [ -d "layout/DEBIAN" ]; then
            cp -r layout/DEBIAN/* build_pkg/DEBIAN/
          elif [ -d "DEBIAN" ]; then
            cp -r DEBIAN/* build_pkg/DEBIAN/
          fi

          # Sao chép các tệp rootless (dylib đã compile sẵn + plist)
          if [ -d "layout" ]; then
            cp -r layout/* build_pkg/ 2>/dev/null || true
            rm -rf build_pkg/layout
          fi

          # Phân quyền chuẩn
          chmod -R 0755 build_pkg
          chmod -R 0644 build_pkg/DEBIAN/control

          # Đóng gói tức thì mức nén nhanh nhất (-Zgzip -z1)
          dpkg-deb -Zgzip -z1 --build build_pkg packages/BoostiPhone6s_rootless.deb

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-FastDeb
          path: packages/*.deb
          retention-days: 7
