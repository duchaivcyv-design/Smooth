name: Build BoostiPhone6s Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT CÔNG CỤ HỖ TRỢ ĐÓNG GÓI ---
      - name: Setup Tools & Environment
        run: |
          THEOS_PATH="$HOME/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          brew install dpkg ldid coreutils python3

      # --- BƯỚC 2: CLONE THEOS & TẢI IPHONEOS 16.5 SDK ---
      - name: Clone Theos & Install SDK
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"
          
          mkdir -p /tmp/sdk_repo
          cd /tmp/sdk_repo
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk/" > .git/info/sparse-checkout
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD
          
          mkdir -p "$TARGET_DIR/sdks"
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          cd ~
          rm -rf /tmp/sdk_repo
          
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Không tìm thấy SDK iPhoneOS16.5!"
             exit 1
          fi

      # --- BƯỚC 2.5: QUÉT SÂU TOÀN BỘ CODE TÌM LỖI ĐEN APP & ĐEN HÌNH NỀN ---
      - name: Deep Black Screen Code Scanner
        run: |
          python3 - << 'EOF'
          import sys, os, re

          target_file = "Tweak.xm"
          if not os.path.exists(target_file):
              print(f"⚠️ Không tìm thấy file {target_file} để quét!")
              sys.exit(0)

          with open(target_file, "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()

          print("=" * 70)
          print(f"🔍 BẮT ĐẦU QUÉT SÂU FILE {target_file} TÌM LỖI ĐEN APP VÀ ĐEN HÌNH NỀN...")
          print("=" * 70)

          # Loại bỏ vùng comment để không quét nhầm code đã tắt
          clean_lines = []
          in_block_comment = False
          for line in lines:
              l_strip = line.strip()
              if in_block_comment:
                  if "*/" in l_strip:
                      in_block_comment = False
                  clean_lines.append("")
                  continue
              if l_strip.startswith("/*"):
                  in_block_comment = True
                  clean_lines.append("")
                  continue
              if l_strip.startswith("//"):
                  clean_lines.append("")
                  continue
              clean_lines.append(line)

          errors = []

          def report_error(title, line_idx, reason, fix_hint):
              start = max(0, line_idx - 2)
              end = min(len(lines), line_idx + 3)
              snippet = []
              for i in range(start, end):
                  prefix = "👉" if i == line_idx else "  "
                  snippet.append(f"{prefix} {i+1:4d} | {lines[i].rstrip()}")
              errors.append({
                  "title": title,
                  "line": line_idx + 1,
                  "snippet": "\n".join(snippet),
                  "reason": reason,
                  "fix": fix_hint
              })

          # 1. Quét biến môi trường Metal làm rụng texture VRAM
          for idx, line in enumerate(clean_lines):
              if "MTL_DISABLE_TEXTURE_RESIDENCY_TRACKING" in line:
                  report_error("Biến môi trường hủy texture Metal (Đen App/WebKit/Flutter)", idx,
                               "GPU không giữ Texture trong VRAM khiến ứng dụng nạp khung hình đen tuyền.",
                               "Thêm // ngắt lệnh setenv này hoặc xóa bỏ hẳn.")
              if "MTL_FORCE_PARALLEL_ENCODE" in line and 'setenv("MTL_FORCE_PARALLEL_ENCODE", "1"' in line:
                  report_error("Ép luồng mã hóa song song Metal (Đen App khi khởi động)", idx,
                               "Gây lỗi Race Condition bộ đệm khi ứng dụng chưa hoàn tất khởi tạo view.",
                               "Thêm // ngắt lệnh setenv này.")

          # 2. Quét PBFPosterExtensionDataStore chặn snapshot hình nền
          pbf_hook = False
          for idx, line in enumerate(clean_lines):
              if "%hook PBFPosterExtensionDataStore" in line:
                  pbf_hook = True
              elif "%end" in line and pbf_hook:
                  pbf_hook = False
              elif pbf_hook and "_updateSnapshot" in line:
                  for sub_idx in range(idx, min(len(clean_lines), idx + 8)):
                      if "%end" in clean_lines[sub_idx]:
                          break
                      if re.search(r'\breturn\s*;', clean_lines[sub_idx]) and "%orig" not in clean_lines[sub_idx]:
                          report_error("Chặn nạp ảnh nền PosterBoard (Đen Hình Nền)", sub_idx,
                                       "Lệnh return chặn hệ thống snapshot cache ảnh nền khiến LockScreen và HomeScreen bị đen xì.",
                                       "Xóa dòng 'return;' và đổi thành '%orig;'.")

          # 3. Quét hủy VSync Cadence trong CADisplay
          for idx, line in enumerate(clean_lines):
              if re.search(r'\bcadence\s*=\s*nil\s*;', line):
                  report_error("Gán Cadence = nil trong CADisplay (Đen Hình Nền)", idx,
                               "Hủy nhịp đồng bộ VSync làm WindowServer không vẽ được lớp nền Backdrop Layer.",
                               "Xóa bỏ dòng 'cadence = nil;' và giữ nguyên '%orig(cadence);'.")

          # 4. Quét ép return YES ở hasDynamicDisplayMode trên màn hình 60Hz
          cadisplay_hook = False
          for idx, line in enumerate(clean_lines):
              if "%hook CADisplay" in line:
                  cadisplay_hook = True
              elif "%end" in line and cadisplay_hook:
                  cadisplay_hook = False
              elif cadisplay_hook and "hasDynamicDisplayMode" in line:
                  for sub_idx in range(idx, min(len(clean_lines), idx + 8)):
                      if "%end" in clean_lines[sub_idx]:
                          break
                      if re.search(r'if\s*\(\s*IS_ACTIVE\s*\)\s*return\s*YES\s*;', clean_lines[sub_idx]):
                          report_error("Ép ProMotion phần cứng trên màn hình 60Hz (Đen Hình Nền)", sub_idx,
                                       "Ép return YES làm driver màn hình ngắt quãng Framebuffer vì phần cứng không hỗ trợ ProMotion vật lý.",
                                       "Sửa thành: 'if (!IS_ACTIVE) return YES; return %orig;'.")

          # 5. Quét ép triệt tiêu SplashScreenDelay
          for idx, line in enumerate(clean_lines):
              if "splashScreenDelay" in line:
                  for sub_idx in range(idx, min(len(clean_lines), idx + 6)):
                      if re.search(r'\breturn\s*0(\.0)?\s*;', clean_lines[sub_idx]):
                          report_error("Triệt tiêu màn hình chờ SplashScreen (Đen App khi mở)", sub_idx,
                                       "Xóa khoảng đệm màn hình chờ khiến app chưa kịp vẽ View đã bị ép hiển thị -> Rơi vào màn hình đen.",
                                       "Đổi thành 'return %orig;' hoặc bỏ hook SBSplashBoardController.")

          # 6. Quét ép độ ưu tiên CAContext commitPriority = 100
          for idx, line in enumerate(clean_lines):
              if "%hook CAContext" in line:
                  for sub_idx in range(idx, min(len(clean_lines), idx + 20)):
                      if "%end" in clean_lines[sub_idx]:
                          break
                      if re.search(r'priority\s*=\s*100\s*;', clean_lines[sub_idx]) or re.search(r'return\s*100\s*;', clean_lines[sub_idx]):
                          report_error("Xung đột quyền ưu tiên Framebuffer CAContext (Đen App)", sub_idx,
                                       "Ép commitPriority = 100 khiến WindowServer từ chối ghép khung hình (compositing) của ứng dụng.",
                                       "Xóa toàn bộ hook %hook CAContext.")
                          break

          # 7. Quét RBSProcessState taskState = 4
          for idx, line in enumerate(clean_lines):
              if "taskState" in line:
                  for sub_idx in range(idx, min(len(clean_lines), idx + 6)):
                      if re.search(r'\breturn\s*4\s*;', clean_lines[sub_idx]):
                          report_error("Ép trạng thái RunningBoard taskState = 4 (Đen App / Kẹt Launching)", sub_idx,
                                       "Làm ngắt quãng chu trình khởi tạo cảnh ForegroundActive của ứng dụng.",
                                       "Xóa toàn bộ hook RBSProcessState.")

          # 8. Quét khóa luồng SCHED_RR cướp CPU trong makeKeyAndVisible
          for idx, line in enumerate(clean_lines):
              if "makeKeyAndVisible" in line:
                  for sub_idx in range(idx, min(len(clean_lines), idx + 10)):
                      if "%end" in clean_lines[sub_idx]:
                          break
                      if "Titanium_LockMainThreadFast" in clean_lines[sub_idx]:
                          report_error("Khóa luồng SCHED_RR trong makeKeyAndVisible (Đen App)", sub_idx,
                                       "Chiếm 100% CPU cướp quyền luồng vẽ giao diện chính của ứng dụng.",
                                       "Thêm // vô hiệu hóa dòng 'Titanium_LockMainThreadFast();'.")

          if errors:
              print("\n" + "!" * 70)
              print(f"🚨 PHÁT HIỆN {len(errors)} VỊ TRÍ GÂY ĐEN APP / ĐEN HÌNH NỀN CẦN SỬA NGAY:")
              print("!" * 70 + "\n")
              for err_idx, err in enumerate(errors, 1):
                  print(f"❌ [LỖI {err_idx}]: {err['title']} (Dòng {err['line']})")
                  print(f"--- Đoạn code thực tế ---")
                  print(err['snippet'])
                  print(f"💡 NGUYÊN NHÂN: {err['reason']}")
                  print(f"🛠 CÁCH SỬA: {err['fix']}")
                  print("-" * 70 + "\n")
              print("❌ BUILD ĐÃ BỊ DỪNG LẠI ĐỂ BẢO VỆ THIẾT BỊ. VUI LÒNG SỬA CÁC DÒNG TRÊN RỒI COMMIT LẠI!")
              sys.exit(1)
          else:
              print("✅ XÁC MINH HOÀN TẤT: Mã nguồn sạch 100%, không còn đoạn code gây đen App hay đen hình nền.")
              print("=" * 70)
          EOF

      # --- BƯỚC 3: DỌN DẸP, BIÊN DỊCH VÀ BÓC TÁCH LỖI CHÍNH XÁC ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "❌ Error: Không tìm thấy Makefile tại thư mục gốc!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          if [ -d "postinst" ]; then chmod 755 postinst; fi
          if [ -d "prerm" ]; then chmod 755 prerm; fi
          
          BUILD_LOG_FILE="/tmp/theos_build.log"
          set +e
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee "$BUILD_LOG_FILE"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "======================================================================"
            echo "🚨 BIÊN DỊCH THẤT BẠI! ĐANG BÓC TÁCH CHÍNH XÁC SỐ DÒNG VÀ ĐOẠN CODE LỖI:"
            echo "======================================================================"

            ERR_LINES=$(grep -E '^[^\s:]+\.(xm|x|m|mm|h|c|cpp):[0-9]+(:[0-9]+)?:\s*error:' "$BUILD_LOG_FILE" || true)

            if [ -z "$ERR_LINES" ]; then
              echo "⚠️ Toàn bộ nhật ký lỗi cuối cùng từ Theos:"
              tail -n 40 "$BUILD_LOG_FILE"
            else
              echo "$ERR_LINES" | while IFS= read -r line; do
                echo "----------------------------------------------------------------------"
                echo "🔴 $line"
                
                FILE_NAME=$(echo "$line" | cut -d: -f1)
                LINE_NUM=$(echo "$line" | cut -d: -f2)

                if [ -f "$FILE_NAME" ] && [ -n "$LINE_NUM" ]; then
                  echo "🔍 Đoạn code thực tế quanh dòng $LINE_NUM trong file $FILE_NAME:"
                  START_LINE=$((LINE_NUM > 3 ? LINE_NUM - 3 : 1))
                  END_LINE=$((LINE_NUM + 3))
                  sed -n "${START_LINE},${END_LINE}p" "$FILE_NAME" | nl -ba -v "$START_LINE" | while IFS= read -r code_line; do
                    NUM=$(echo "$code_line" | awk '{print $1}')
                    if [ "$NUM" -eq "$LINE_NUM" ]; then
                      echo "👉 $code_line"
                    else
                      echo "   $code_line"
                    fi
                  done
                fi
                echo "----------------------------------------------------------------------"
              done
            fi
            echo "======================================================================"
            exit 1
          fi
          
          ls -lh packages/*.deb || { echo "❌ Không tìm thấy deb!"; exit 1; }

      # --- BƯỚC 4: TẢI FILE DEB LÊN ARTIFACTS ---
      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-Deb
          path: packages/*.deb
          retention-days: 7
