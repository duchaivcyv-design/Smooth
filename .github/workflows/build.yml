name: Build BoostiPhone6s Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT CÔNG CỤ HỖ TRỢ ĐÓNG GÓI ---
      - name: Setup Tools & Environment
        run: |
          THEOS_PATH="$HOME/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          # Cài dpkg, ldid, coreutils và python3
          brew install dpkg ldid coreutils python3

      # --- BƯỚC 2: CLONE THEOS & TẢI IPHONEOS 16.5 SDK ---
      - name: Clone Theos & Install SDK
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"
          
          mkdir -p /tmp/sdk_repo
          cd /tmp/sdk_repo
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk/" > .git/info/sparse-checkout
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD
          
          mkdir -p "$TARGET_DIR/sdks"
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          cd ~
          rm -rf /tmp/sdk_repo
          
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Không tìm thấy SDK iPhoneOS16.5!"
             exit 1
          fi

      # --- BƯỚC 2.5: CỔNG BẢO VỆ MÃ NGUỒN BẢN 3.1 (ĐÃ SỬA LỖI BIẾN VÀ LỌC FILE THÔNG MINH) ---
      - name: Pre-Build Source Code & iOS Security Gate V3.1
        run: |
          python3 - << 'EOF'
          import os, re, sys

          RULES = [
              # 1. Phân quyền RootHide / Rootless
              {
                  "pattern": r'(access|open|fopen|chmod|chown)\s*\(\s*\"/var/jb',
                  "guard": None,
                  "cat": "RootHide/Rootless Path Crash",
                  "msg": "Hardcode đường dẫn '/var/jb' trong C call -> Gây crash sandbox hoặc sai UUID trên RootHide. Dùng dynamic prefix."
              },
              {
                  "pattern": r'@\"/var/jb/var/mobile/Library/Preferences',
                  "guard": r"Titanium_ResolvePrefPath|Titanium_GetRootHidePrefixPath|jbroot",
                  "cat": "RootHide Pref Path",
                  "msg": "Hardcode đường dẫn Preferences tuyệt đối -> Không đọc/ghi được cấu hình trên RootHide."
              },
              # 2. Crash Symbol iOS 14
              {
                  "pattern": r"(CAFrameRateRangeMake|setPreferredFrameRateRange:)",
                  "guard": r"@available\s*\(\s*iOS\s*15",
                  "cat": "iOS 14 Symbol Crash",
                  "msg": "Dùng API CAFrameRateRange nhưng không bọc @available(iOS 15.0, *) -> Crash Safe Mode trên iOS 14."
              },
              {
                  "pattern": r"\[self\.layer\s+setCornerCurve:|\.cornerCurve\s*=",
                  "guard": r"respondsToSelector.*cornerCurve",
                  "cat": "iOS 12-14 Crash",
                  "msg": "Gán trực tiếp cornerCurve trên CALayer mà không kiểm tra respondsToSelector."
              },
              # 3. Kìm hãm 120Hz ProMotion thật
              {
                  "pattern": r"(CAFrameRateRangeMake\s*\(\s*60\.0f\s*,\s*120\.0f\s*,\s*60\.0f\s*\)|safeFPS\s*=\s*60)",
                  "guard": r"HardwareHasNative120Hz",
                  "cat": "ProMotion Drop Throttle",
                  "msg": "Ép trần 60Hz mà không kiểm tra HardwareHasNative120Hz() -> Gây sụt FPS trên 13 Pro đến 15 Pro Max."
              },
              # 4. Nguy cơ treo UI
              {
                  "pattern": r"\[\w+\s+layoutIfNeeded\]",
                  "guard": None,
                  "cat": "UI Hang/Lag Launch",
                  "msg": "Cưỡng ép layout đồng bộ -> Gây khựng từ 200-500ms khi mở app hoặc cuộn Switcher."
              }
          ]

          EXTENSIONS = ('.xm', '.x', '.m', '.mm', '.h', '.c', '.cpp', '.plist')
          EXCLUDED = ('.theos', 'obj', 'packages', '.git')

          files_list = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in EXCLUDED]
              for f in files:
                  if f.endswith(EXTENSIONS) or f in ['Makefile', 'control']:
                      files_list.append(os.path.join(root, f))

          critical_errors = []
          all_source = ""

          for fpath in files_list:
              try:
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                      lines = content.splitlines()

                  if fpath.endswith(('.xm', '.x', '.m', '.mm')):
                      all_source += "\n" + content

                  if fpath.endswith(('.xm', '.x')):
                      # 1. Kiểm tra toàn vẹn thẻ Logos
                      hooks = len(re.findall(r"^\s*%hook\b", content, re.MULTILINE))
                      groups = len(re.findall(r"^\s*%group\b", content, re.MULTILINE))
                      subclasses = len(re.findall(r"^\s*%subclass\b", content, re.MULTILINE))
                      ends = len(re.findall(r"^\s*%end\b", content, re.MULTILINE))
                      req = hooks + groups + subclasses

                      if req != ends:
                          critical_errors.append({
                              "file": fpath,
                              "line": "N/A",
                              "cat": "Lệch Thẻ Logos",
                              "detail": f"Có {hooks} %hook, {groups} %group, {subclasses} %subclass (cần {req} %end), nhưng chỉ tìm thấy {ends} %end.",
                              "code": "Cần đồng bộ lại các cặp đóng %end"
                          })

                      # 2. Kiểm tra trùng lặp hook
                      hook_targets = re.findall(r"^\s*%hook\s+([A-Za-z0-9_]+)", content, re.MULTILINE)
                      seen_hooks = set()
                      dup_hooks = set()
                      for ht in hook_targets:
                          if ht in seen_hooks:
                              dup_hooks.add(ht)
                          else:
                              seen_hooks.add(ht)
                      if dup_hooks:
                          for dh in sorted(dup_hooks):
                              critical_errors.append({
                                  "file": fpath,
                                  "line": "N/A",
                                  "cat": "Trùng Lặp Hook",
                                  "detail": f"Lớp `{dh}` bị khai báo %hook nhiều lần trong cùng file -> Gây lỗi redefinition.",
                                  "code": f"%hook {dh}"
                              })

                  # 3. Quét từng dòng theo RULES (chỉ quét file mã nguồn và plist)
                  if fpath.endswith(('.xm', '.x', '.m', '.mm', '.h', '.c', '.cpp', '.plist')):
                      in_block_comment = False
                      for idx, line in enumerate(lines, 1):
                          sline = line.strip()

                          if "/*" in sline:
                              in_block_comment = True
                          if "*/" in sline:
                              in_block_comment = False
                              continue
                          if in_block_comment or sline.startswith("//") or sline.startswith("*"):
                              continue

                          if sline.startswith("#import") or sline.startswith("#include") or sline.startswith("typedef"):
                              continue

                          for r in RULES:
                              if re.search(r["pattern"], line):
                                  has_guard = False
                                  if r["guard"]:
                                      ctx_start = max(0, idx - 18)
                                      ctx = "\n".join(lines[ctx_start:idx])
                                      if re.search(r["guard"], ctx):
                                          has_guard = True

                                  if not has_guard:
                                      critical_errors.append({
                                          "file": fpath,
                                          "line": idx,
                                          "cat": r["cat"],
                                          "detail": r["msg"],
                                          "code": sline[:80]
                                      })
              except Exception as e:
                  print(f"Lỗi đọc file {fpath}: {e}")

          # 4. Kiểm tra đồng bộ mô-đun
          defined_grps = set(re.findall(r"^\s*%group\s+([A-Za-z0-9_]+)", all_source, re.MULTILINE))
          initialized_grps = set(re.findall(r"%init\s*\(\s*([A-Za-z0-9_]+)\s*\)", all_source))

          uninit_grps = defined_grps - initialized_grps
          for grp in sorted(uninit_grps):
              critical_errors.append({
                  "file": "Tweak.xm",
                  "line": "N/A",
                  "cat": "Mô-đun Mồ Côi",
                  "detail": f"Group `{grp}` được khai báo nhưng KHÔNG có `%init({grp})` trong %ctor -> Module bị vô hiệu hóa!",
                  "code": f"%group {grp}"
              })

          ghost_grps = initialized_grps - defined_grps
          for grp in sorted(ghost_grps):
              critical_errors.append({
                  "file": "Tweak.xm",
                  "line": "N/A",
                  "cat": "Mô-đun Không Tồn Tại",
                  "detail": f"Lệnh gọi `%init({grp})` tham chiếu đến Group chưa từng được định nghĩa -> Gây lỗi compile Logos.",
                  "code": f"%init({grp})"
              })

          # 5. Kiểm tra plist
          has_plist = any(f.endswith('.plist') for f in files_list)
          if not has_plist:
              critical_errors.append({
                  "file": "Project Root",
                  "line": "N/A",
                  "cat": "Thiếu Filter Plist",
                  "detail": "Không tìm thấy file .plist bộ lọc bundle (vd: BoostiPhone6sCore.plist).",
                  "code": "Cần có file <TweakName>.plist cùng cấp Makefile"
              })

          if critical_errors:
              print("\n" + "=" * 80)
              print("🚨 CỔNG BẢO VỆ PHÁT HIỆN LỖI CHÍ MẠNG! KHÔNG THỂ BẮT ĐẦU BIÊN DỊCH")
              print("=" * 80)
              for err in critical_errors:
                  print(f"❌ [LỖI] [{err['cat']}] tại {err['file']}:{err['line']}")
                  print(f"   Đoạn code: {err['code']}")
                  print(f"   Hướng dẫn: {err['detail']}\n")
              print("=" * 80)
              print(f"Tổng cộng phát hiện {len(critical_errors)} lỗi. Dừng workflow ngay tại bước kiểm tra.\n")
              sys.exit(1)
          else:
              print("\n" + "=" * 80)
              print("✅ KIỂM TOÁN HOÀN TẤT: Mã nguồn hợp lệ, an toàn cho cả iOS 14 - 26+ và iPhone 6s - 15 Pro Max!")
              print("=" * 80 + "\n")
          EOF

      # --- BƯỚC 3: DỌN DẸP, BIÊN DỊCH VÀ TỰ ĐỘNG BÓC TÁCH LỖI MÃ NGUỒN ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "❌ Error: Không tìm thấy Makefile tại thư mục gốc!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          if [ -d "postinst" ]; then chmod 755 postinst; fi
          if [ -d "prerm" ]; then chmod 755 prerm; fi
          
          BUILD_LOG_FILE="/tmp/theos_build.log"
          
          set +e
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee "$BUILD_LOG_FILE"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "======================================================================"
            echo "🚨 PHÁT HIỆN LỖI BIÊN DỊCH! HỆ THỐNG ĐANG QUÉT CÁC DÒNG LỖI CỤ THỂ..."
            echo "======================================================================"
            
            ERROR_ENTRIES=$(grep -E '^[^ :]+:[0-9]+(:[0-9]+)?:[[:space:]]+error:' "$BUILD_LOG_FILE" | head -n 5)
            
            if [ -n "$ERROR_ENTRIES" ]; then
              while IFS= read -r line; do
                ERR_FILE=$(echo "$line" | cut -d':' -f1)
                ERR_LINE=$(echo "$line" | cut -d':' -f2)
                ERR_MSG=$(echo "$line" | cut -d':' -f3-)
                
                echo ""
                echo "----------------------------------------------------------------------"
                echo "📍 TỆP TIN: $ERR_FILE"
                echo "⚠️  DÒNG SỐ: $ERR_LINE"
                echo "❌ THÔNG BÁO: $ERR_MSG"
                echo "----------------------------------------------------------------------"
                
                ACTUAL_PATH=""
                if [ -f "$ERR_FILE" ]; then
                  ACTUAL_PATH="$ERR_FILE"
                else
                  FOUND_PATH=$(find . -name "$(basename "$ERR_FILE")" -not -path "*/.theos/*" -not -path "*/.git/*" | head -n 1)
                  if [ -n "$FOUND_PATH" ]; then
                    ACTUAL_PATH="$FOUND_PATH"
                  fi
                fi

                if [ -n "$ACTUAL_PATH" ] && [ -f "$ACTUAL_PATH" ]; then
                  START_LINE=$((ERR_LINE > 15 ? ERR_LINE - 15 : 1))
                  END_LINE=$((ERR_LINE + 15))
                  echo "🔍 ĐOẠN CODE XUNG QUANH DÒNG $ERR_LINE ($ACTUAL_PATH):"
                  nl -ba "$ACTUAL_PATH" | sed -n "${START_LINE},${END_LINE}p"
                else
                  echo "⚠ Không tìm thấy tệp nguồn thực tế tương ứng với: $ERR_FILE"
                fi
              done <<< "$ERROR_ENTRIES"
            else
              echo "⚠️ Không bắt được định dạng tệp:dòng thông thường. 30 dòng log cuối cùng:"
              tail -n 30 "$BUILD_LOG_FILE"
            fi
            
            echo "======================================================================"
            exit 1
          fi
          
          ls -lh packages/*.deb || { 
            echo "❌ Build hoàn tất nhưng không tìm thấy file .deb!"; 
            exit 1; 
          }

      # --- BƯỚC 4: TẢI FILE DEB LÊN ARTIFACTS ---
      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-Deb
          path: packages/*.deb
          retention-days: 7
