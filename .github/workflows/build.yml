name: Build BoostiPhone6s Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: THIẾT LẬP MÔI TRƯỜNG ROOTLESS & CÀI TOOL CẦN THIẾT ---
      - name: Setup Environment Variables
        run: |
          THEOS_PATH="$HOME/theos"
          
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          # Chỉ cài những công cụ Theos thực sự thiếu trên macOS runner để không bị spam cảnh báo vàng
          brew install make ldid dpkg coreutils
          
          echo "/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      # --- BƯỚC 2: CLONE THEOS & TẢI SDK IPHONEOS 16.5 ---
      - name: Clone Theos & Install SDK via Git Sparse
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"
          
          mkdir -p /tmp/sdk_repo
          cd /tmp/sdk_repo
          
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk/" > .git/info/sparse-checkout
          
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD
          
          mkdir -p "$TARGET_DIR/sdks"
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          
          cd ~
          rm -rf /tmp/sdk_repo
          
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Failed to move SDK."
             exit 1
          fi

      # --- BƯỚC 3: DỌN DẸP VÀ BUILD ĐÓNG GÓI .DEB ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "❌ Error: No Makefile found!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          # Đóng gói Rootless dứt điểm
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          
          # Kiểm tra file thành phẩm
          ls -lh packages/*.deb || { 
            echo "❌ Build finished but no deb found in packages/"; 
            exit 1; 
          }

      # --- BƯỚC 4: XUẤT FILE .DEB THÀNH PHẨM LÊN ARTIFACTS ---
      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-Deb
          path: packages/*.deb
          retention-days: 7
