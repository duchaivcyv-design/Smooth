name: Build Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT TOOL & THIẾT LẬP MÔI TRƯỜNG ---
      - name: Setup Environment Variables
        run: |
          THEOS_PATH="$HOME/theos"
          
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          brew install make ldid dpkg coreutils wget curl git xz unzip
          
          # Thêm GNU Make và CoreUtils vào PATH
          echo "/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      # --- BƯỚC 2: CLONE THEOS & TẢI SDK (FIXED LOGIC) ---
      - name: Clone Theos & Install SDK
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          
          echo "📥 Cloning Theos to $TARGET_DIR..."
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"

          echo "📦 Downloading iOS SDK from theos/sdks repository..."
          mkdir -p "$TARGET_DIR/sdks"
          cd "$TARGET_DIR/sdks"

          # Logic thông minh: Lấy danh sách file .tar.xz mới nhất từ branch master
          # Chúng ta lọc tìm file chứa "iPhoneOS" và ".sdk.tar.xz"
          echo "Querying available SDKs..."
          
          # Dùng API GitHub để list files trong thư mục gốc của branch master
          FILES_JSON=$(curl -s https://api.github.com/repos/theos/sdks/contents/)
          
          # Trích xuất tên file đầu tiên khớp điều kiện (thường là bản mới nhất do sắp xếp alphabet/time)
          # Regex tìm chuỗi kết thúc bằng .sdk.tar.xz và bắt đầu bằng iPhoneOS
          SDK_FILENAME=$(echo "$FILES_JSON" | grep '"name"' | grep 'iPhoneOS.*\.sdk\.tar\.xz' | head -n 1 | cut -d '"' -f 4)

          if [ -z "$SDK_FILENAME" ]; then
              echo "❌ Critical Error: Could not find any valid iPhoneOS SDK filename via API."
              echo "Debug Output:"
              echo "$FILES_JSON"
              exit 1
          fi

          echo "✅ Found latest SDK: $SDK_FILENAME"
          echo "⬇️ Downloading..."
          
          # Tải file vừa tìm được
          wget -q "https://raw.githubusercontent.com/theos/sdks/master/$SDK_FILENAME" -O sdk.tar.xz
          
          echo "📂 Extracting..."
          tar xf sdk.tar.xz
          rm sdk.tar.xz
          
          # Kiểm tra kết quả
          ls -la
          echo "✅ SDK Installation Complete."

      # --- BƯỚC 3: BUILD PACKAGE ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          # Chạy build
          make clean package FINALPACKAGE=1
          
          ls -lh packages/*.deb || echo "Build finished but no deb found"

      # --- BƯỚC 4: UPLOAD ARTIFACT ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyRootlessTweak.deb
          path: packages/*.deb
