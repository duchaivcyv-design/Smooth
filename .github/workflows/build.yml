name: Build Rootless Deb & Deploy Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write # Cấp quyền cho GitHub Actions tự push code/Deploy Pages

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT TOOL & THIẾT LẬP MÔI TRƯỜNG ---
      - name: Setup Environment Variables
        run: |
          THEOS_PATH="$HOME/theos"
          
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          brew install make ldid dpkg coreutils wget curl git xz unzip
          
          # Thêm GNU Make và CoreUtils vào PATH
          echo "/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      # --- BƯỚC 2: CLONE THEOS & TẢI SDK ---
      - name: Clone Theos & Install SDK via Git Sparse
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          
          echo "📥 Cloning Theos to $TARGET_DIR..."
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"

          echo "📦 Downloading iOS SDK using Git Sparse-Checkout..."
          
          mkdir -p /tmp/sdk_repo
          cd /tmp/sdk_repo
          
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk/" > .git/info/sparse-checkout
          
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD
          
          mkdir -p "$TARGET_DIR/sdks"
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          
          cd ~
          rm -rf /tmp/sdk_repo
          
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Failed to move SDK."
             exit 1
          fi
          
          echo "✅ SDK Installation Complete."

      # --- BƯỚC 3: BUILD PACKAGE ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          # Chạy build package
          make clean package FINALPACKAGE=1
          
          ls -lh packages/*.deb || echo "Build finished but no deb found"

      # --- BƯỚC 4: TỰ ĐỘNG CẬP NHẬT CẤU TRÚC REPO CYDIA/SILEO ---
      - name: Generate Repo Index & Package Metadata
        run: |
          cd $GITHUB_WORKSPACE
          
          # 1. Tạo thư mục deb/ chứa file cài đặt cho Repo
          mkdir -p deb
          
          # 2. Copy file .deb mới vừa build vào thư mục deb/
          cp packages/*.deb deb/
          
          # 3. Dọn dẹp triệt để thư mục/file cũ để tránh lỗi 404 và trùng lặp
          rm -rf Packages Packages.bz2 Packages.xz Release
          
          # 4. Tạo lại file Packages danh sách tweak chuẩn
          dpkg-scanpackages -m ./deb /dev/null > Packages
          
          # 5. Nén danh sách thành bz2 và xz
          bzip2 -f -k Packages
          xz -f -k Packages
          
          # 6. TẠO FILE RELEASE ĐỂ SILEO/ZEBRA NHẬN DẠNG REPO & KHÔNG BÁO LỖI 404
          cat <<EOF > Release
          Origin: Smooth Repo
          Label: Smooth
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Repo Tweak Smooth iphone 6s-x ios 15-16.7.16
          EOF
          
          echo "Repo Metadata & Release File Successfully Created!"

      # --- BƯỚC 5: ĐẨY TỰ ĐỘNG LÊN BRANCH GH-PAGES (PUBLIC REPO) ---
      - name: Deploy Repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
