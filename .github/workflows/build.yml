name: Build BoostiPhone6s Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============================================================
      # CACHE THEOS + SDK + HOMEBREW PACKAGES
      # Lần đầu: ~3-5 phút | Lần sau: ~5-10s (cache hit)
      # ============================================================
      - name: Cache Theos + SDK + Homebrew
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            ~/theos
            ~/Library/Caches/Homebrew/downloads
            /opt/homebrew/Cellar/dpkg
            /opt/homebrew/Cellar/ldid
          key: theos-sdk-165-${{ runner.os }}-v2

      # ============================================================
      # CÀI CÔNG CỤ NHANH — BỎ coreutils (không cần thiết)
      # Nếu cache hit → ~2s. Nếu cache miss → ~60s
      # ============================================================
      - name: Setup Tools (Fast)
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_ANALYTICS=1
          #ài Chỉ c dpkg + ldid (bỏ coreutils thừa)
          if ! command -v dpkg-deb &> /dev/null; then brew install dpkg; fi
          if ! command -v ldid &> /dev/null; then brew install ldid; fi

          # Xuất biến môi trường cho các bước sau
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          echo "THEOS_NO_AUTO_UPDATE=1" >> $GITHUB_ENV

      # ============================================================
      # CHỈ CLONE THEOS NẾU CACHE MISS
      # ============================================================
      - name: Clone Theos + SDK (Cache Miss Only)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          TARGET_DIR="$HOME/theos"
          rm -rf "$TARGET_DIR"
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$TARGET_DIR"

          # Link ldid
          mkdir -p "$TARGET_DIR/bin"
          BREW_LDID=$(which ldid || true)
          if [ -n "$BREW_LDID" ]; then
            ln -sf "$BREW_LDID" "$TARGET_DIR/bin/ldid"
          fi

          # Tải SDK 16.5 (sparse checkout — chỉ lấy 1 SDK)
          mkdir -p "$TARGET_DIR/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          rm -rf /tmp/sdks

          echo "✅ Theos + SDK cài lần đầu xong (cache sẽ dùng cho lần sau)"

      # ============================================================
      # BUILD — CHỈ `make package` (BỎ `make clean` vì đã rm -rf)
      # ============================================================
      - name: Build Package (Rootless)
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ ! -f Makefile ]; then
            echo "❌ Không tìm thấy Makefile!"; exit 1
          fi

          # Dọn dẹp 1 lần duy nhất, không dùng make clean
          rm -rf packages obj .theos

          # Chuẩn hoá quyền DEBIAN
          for DEBIAN_DIR in "layout/DEBIAN" "DEBIAN"; do
            if [ -d "$DEBIAN_DIR" ]; then
              find "$DEBIAN_DIR" -type f -exec chmod 644 {} +
              find "$DEBIAN_DIR" -type f \( -name "postinst" -o -name "prerm" -o -name "postrm" -o -name "preinst" \) -exec chmod 755 {} +
              chmod 755 "$DEBIAN_DIR"
            fi
          done

          BUILD_LOG="/tmp/theos_build.log"
          set -o pipefail
          # macOS runner: 3-4 cores thực dụng
          NCPU=$(sysctl -n hw.ncpu | head -1)
          if [ -z "$NCPU" ] || [ "$NCPU" -lt 2 ]; then NCPU=4; fi

          # CHỈ make package (không make clean) — nhanh hơn ~30%
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            SDKVERSION=16.5 \
            -j"$NCPU" 2>&1 | tee "$BUILD_LOG" || BUILD_FAILED=1

          if [ "$BUILD_FAILED" = "1" ]; then
            echo ""
            echo "======================================================================"
            echo "🚨 BIÊN DỊCH THẤT BẠI!"
            echo "======================================================================"
            grep -E '(error:|fatal error:)' "$BUILD_LOG" || true
            echo ""
            tail -n 60 "$BUILD_LOG"
            exit 1
          fi

          ls -lh packages/*.deb

      # ============================================================
      # UPLOAD — bỏ retention 7 ngày (mặc định đủ)
      # ============================================================
      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-FullPackage
          path: packages/*.deb
          if-no-files-found: error
          compression-level: 0    # Deb đã nén, không nén lại
