name: Build BoostiPhone6s Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT CÔNG CỤ HỖ TRỢ ĐÓNG GÓI ---
      - name: Setup Tools & Environment
        run: |
          THEOS_PATH="$HOME/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          brew install dpkg ldid coreutils python3

      # --- BƯỚC 2: CLONE THEOS & TẢI IPHONEOS 16.5 SDK ---
      - name: Clone Theos & Install SDK
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"
          
          mkdir -p /tmp/sdk_repo
          cd /tmp/sdk_repo
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk/" > .git/info/sparse-checkout
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD
          
          mkdir -p "$TARGET_DIR/sdks"
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          cd ~
          rm -rf /tmp/sdk_repo
          
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Không tìm thấy SDK iPhoneOS16.5!"
             exit 1
          fi

      # --- BƯỚC 3: QUÉT TOÀN DIỆN: TRÙNG LẶP XUYÊN NHÓM + LỖI CÚ PHÁP %ORIG ---
      - name: Deep Scan Duplicates & Syntax Errors
        run: |
          python3 - << 'EOF'
          import re
          import sys
          import glob

          files = glob.glob("**/*.xm", recursive=True) + glob.glob("**/*.x", recursive=True)
          if not files:
              print("⚠️ Không tìm thấy file .xm nào để quét!")
              sys.exit(0)

          has_critical_error = False

          def clean_selector(method_head):
              tokens = re.findall(r'([A-Za-z0-9_]+)\s*:', method_head)
              if tokens:
                  return ":".join(tokens) + ":"
              match = re.search(r'[-+]\s*\([^)]+\)\s*([A-Za-z0-9_]+)', method_head)
              if match:
                  return match.group(1)
              return method_head.strip()

          for filepath in files:
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()

              current_group_id = "__GLOBAL__"
              current_group_title = "Phần code chung (Ngoài nhóm)"
              latest_comment_header = ""

              in_hook = False
              curr_class = ""
              curr_method = ""
              curr_method_start = 0
              curr_method_body = []
              in_method = False

              # Map: method_registry[(class_name, clean_sel)] = [ {group, title, start, end, body} ]
              method_registry = {}
              orig_syntax_warnings = []

              for idx, raw_line in enumerate(lines, 1):
                  line = raw_line.strip()

                  # Bắt tiêu đề nhóm dạng: // NHÓM X: ...
                  group_title_match = re.search(r'//\s*(=+\s*)?(NHÓM\s+\d+[^=\n\r]*)', line, re.IGNORECASE)
                  if group_title_match:
                      latest_comment_header = group_title_match.group(2).strip()

                  # Bắt khai báo %group
                  group_match = re.match(r'^%group\s+([A-Za-z0-9_]+)', line)
                  if group_match:
                      current_group_id = group_match.group(1)
                      if latest_comment_header:
                          current_group_title = f"{latest_comment_header} (%group {current_group_id})"
                      else:
                          current_group_title = f"%group {current_group_id}"
                      continue

                  # Bắt đầu %hook ClassName
                  hook_match = re.match(r'^%hook\s+([A-Za-z0-9_]+)', line)
                  if hook_match:
                      in_hook = True
                      curr_class = hook_match.group(1)
                      continue

                  if in_hook and line.startswith("%end"):
                      in_hook = False
                      curr_class = ""
                      continue

                  # Quét khai báo phương thức Objective-C bên trong %hook
                  if in_hook:
                      method_match = re.match(r'^([-+]\s*\([^{]+?\{?)', line)
                      if method_match and not in_method:
                          in_method = True
                          curr_method = clean_selector(method_match.group(1))
                          curr_method_start = idx
                          curr_method_body = [raw_line]
                          continue

                      if in_method:
                          curr_method_body.append(raw_line)
                          
                          # Bắt lỗi nguy cơ gây "Invalid argument structure in %orig"
                          if re.search(r'%orig\s*\([^)]+?\)\s*;', line):
                              orig_syntax_warnings.append({
                                  "line": idx,
                                  "class": curr_class,
                                  "method": curr_method,
                                  "content": line
                              })

                          # Kết thúc method khi gặp dấu ngoặc nhọn đóng ở đầu dòng
                          if line.startswith("}"):
                              in_method = False
                              key = (curr_class, curr_method)
                              if key not in method_registry:
                                  method_registry[key] = []
                              method_registry[key].append({
                                  "group_id": current_group_id,
                                  "group_title": current_group_title,
                                  "start_line": curr_method_start,
                                  "end_line": idx,
                                  "body": "".join(curr_method_body)
                              })

              # --- 1. KIỂM TRA LỖI NGUY CƠ CÚ PHÁP %ORIG(...) ---
              if orig_syntax_warnings:
                  print("\n" + "="*80)
                  print(f"⚠️ CẢNH BÁO CÚ PHÁP DỄ GÃY BUILD (Invalid argument structure): {filepath}")
                  print("="*80)
                  for warn in orig_syntax_warnings:
                      print(f"📍 Dòng {warn['line']} trong [{warn['class']} {warn['method']}]:")
                      print(f"   Code hiện tại: {warn['content']}")
                      print(f"   👉 KHẮC PHỤC: Hãy đổi thành '%orig;' (bỏ ngoặc đơn và đối số) để Theos tự forward an toàn.\n")

              # --- 2. BẮT TRÙNG LẶP PHƯƠNG THỨC XUYÊN NHÓM ---
              for (class_name, method_sel), occurrences in method_registry.items():
                  if len(occurrences) > 1:
                      has_critical_error = True
                      print("\n" + "="*80)
                      print(f"🚨 PHÁT HIỆN HOOK TRÙNG LẶP: -[{class_name} {method_sel}] trong file {filepath}")
                      print("="*80)
                      
                      def score_block(b):
                          body = b["body"]
                          score = len(body)
                          if "144" in body: score += 5000
                          if "Titanium_" in body: score += 2000
                          if "ZeroLatency" in body: score += 2000
                          if "flush" in body: score += 1000
                          return score

                      sorted_occ = sorted(occurrences, key=score_block, reverse=True)
                      best_block = sorted_occ[0]
                      del_blocks = sorted_occ[1:]

                      print(f"❌ Phương thức này bị hook tới {len(occurrences)} lần xuyên các nhóm:")
                      for i, occ in enumerate(occurrences, 1):
                          print(f"   🔹 Lần {i}: Dòng {occ['start_line']} -> {occ['end_line']} | Thuộc: [{occ['group_title']}]")

                      print("\n🎯 KẾT LUẬN & HƯỚNG DẪN XỬ LÝ CHÍNH XÁC:")
                      print(f"   ✅ NÊN GIỮ LẠI TẠI: [{best_block['group_title']}] (Dòng {best_block['start_line']} -> {best_block['end_line']})")
                      print(f"   ❌ PHẢI XOÁ BỎ TẠI:")
                      for d in del_blocks:
                          print(f"      🗑️ Xóa từ dòng {d['start_line']} đến dòng {d['end_line']} tại: [{d['group_title']}]")
                      print("-" * 80)

          if has_critical_error:
              print("\n🛑 DỪNG BUILD: Hãy xóa các phương thức bị hook trùng lặp theo danh sách chỉ định ở trên!")
              sys.exit(1)
          else:
              print("✅ Quét thành công: Code sạch 100%, không bị trùng lặp hook xuyên nhóm!")
          EOF

      # --- BƯỚC 4: DỌN DẸP, BIÊN DỊCH VÀ BÓC TÁCH LỖI CHÍNH XÁC ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if ! [ -f Makefile ]; then
            echo "❌ Error: Không tìm thấy Makefile tại thư mục gốc!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          if [ -d "layout/DEBIAN" ]; then chmod -R 755 layout/DEBIAN; fi
          
          BUILD_LOG_FILE="/tmp/theos_build.log"
          
          set -o pipefail
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee "$BUILD_LOG_FILE" || BUILD_FAILED=1

          if [ "$BUILD_FAILED" = "1" ]; then
            echo ""
            echo "======================================================================"
            echo "🚨 BIÊN DỊCH THẤT BẠI! BÁO CÁO CHI TIẾT TỪ TRÌNH BIÊN DỊCH CLANG:"
            echo "======================================================================"

            grep -E '(error:|fatal error:)' "$BUILD_LOG_FILE" || true
            
            echo ""
            echo "----------------------------------------------------------------------"
            echo "🔍 TOÀN BỘ 60 DÒNG LOG CUỐI CÙNG TRƯỚC KHI GÃY BUILD:"
            echo "----------------------------------------------------------------------"
            tail -n 60 "$BUILD_LOG_FILE"
            echo "======================================================================"
            exit 1
          fi
          
          ls -lh packages/*.deb || { echo "❌ Không tìm thấy deb!"; exit 1; }

      # --- BƯỚC 5: TẢI FILE DEB LÊN ARTIFACTS ---
      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostiPhone6s-Rootless-Deb
          path: packages/*.deb
          retention-days: 7
