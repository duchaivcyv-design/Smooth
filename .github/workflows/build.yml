name: Build Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 1: CÀI ĐẶT TOOL & THIẾT LẬP MÔI TRƯỜNG ---
      - name: Setup Environment Variables
        run: |
          THEOS_PATH="$HOME/theos"
          
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          brew install make ldid dpkg coreutils wget curl git xz unzip
          
          # Thêm GNU Make và CoreUtils vào PATH
          echo "/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      # --- BƯỚC 2: CLONE THEOS & TẢI SDK (SPARSE CHECKOUT METHOD) ---
      - name: Clone Theos & Install SDK via Git Sparse
        run: |
          TARGET_DIR="${{ env.THEOS }}"
          
          echo "📥 Cloning Theos to $TARGET_DIR..."
          if [ -d "$TARGET_DIR" ]; then rm -rf "$TARGET_DIR"; fi
          git clone --recursive https://github.com/theos/theos.git "$TARGET_DIR"

          echo "📦 Downloading iOS SDK using Git Sparse-Checkout (Fastest Method)..."
          
          # Tạo thư mục tạm để clone repo SDK
          mkdir -p /tmp/sdk_repo
          cd /tmp/sdk_repo
          
          # Khởi tạo repo rỗng
          git init
          git remote add origin https://github.com/theos/sdks.git
          
          # Bật chế độ sparse checkout (chỉ lấy file/folder được chỉ định)
          git config core.sparseCheckout true
          
          # Chỉ định folder SDK muốn tải (iPhoneOS16.5.sdk)
          # Nếu muốn bản khác, sửa tên ở đây
          echo "iPhoneOS16.5.sdk/" > .git/info/sparse-checkout
          
          # Fetch và Checkout (Chỉ tải dữ liệu của folder đó, cực nhanh)
          echo "Fetching specific SDK folder..."
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD
          
          # Di chuyển folder SDK vừa tải về vào đúng chỗ trong Theos
          mkdir -p "$TARGET_DIR/sdks"
          mv iPhoneOS16.5.sdk "$TARGET_DIR/sdks/"
          
          # Dọn dẹp rác
          cd ~
          rm -rf /tmp/sdk_repo
          
          # Kiểm tra kết quả
          if [ ! -d "$TARGET_DIR/sdks/iPhoneOS16.5.sdk" ]; then
             echo "❌ Error: Failed to move SDK."
             exit 1
          fi
          
          echo "✅ SDK Installation Complete."
          du -sh "$TARGET_DIR/sdks/iPhoneOS16.5.sdk"

      # --- BƯỚC 3: BUILD PACKAGE ---
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ ! -f Makefile ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          
          rm -rf packages/ obj/ .theos/
          
          # Chạy build
          make clean package FINALPACKAGE=1
          
          ls -lh packages/*.deb || echo "Build finished but no deb found"

      # --- BƯỚC 4: UPLOAD ARTIFACT ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyRootlessTweak.deb
          path: packages/*.deb
