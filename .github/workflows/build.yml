name: Build Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Setup Environment
        run: |
          # 1. Cài đặt tools bắt buộc
          brew install make ldid dpkg coreutils wget curl git
      
          # 2. Thiết lập biến môi trường cho toàn bộ Job
          export THEOS_DIR="$GITHUB_WORKSPACE/theos"
          
          echo "THEOS=$THEOS_DIR" >> $GITHUB_ENV
          echo "$THEOS_DIR/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          # Thêm đường dẫn GNU Make/CoreUtils vào PATH để tránh lỗi cú pháp trên macOS
          echo "/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" >> $GITHUB_PATH

      - name: Clone Theos Framework
        run: |
          if [ -d "$THEOS_DIR" ]; then
            rm -rf "$THEOS_DIR"
          fi
          
          echo "📥 Cloning Theos..."
          git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR"

      - name: Download iOS SDK (Auto-Fix Method)
        run: |
          cd "$THEOS_DIR/sdks"
          
          # Xóa SDK cũ nếu có để đảm bảo sạch sẽ
          rm -rf *.sdk *.tar.xz
          
          echo "📥 Downloading latest stable iPhoneOS SDK via Theos helper..."
          
          # Sử dụng script chính thức của Theos để tải SDK
          # Nó sẽ tự động chọn phiên bản mới nhất (thường là 16.x hoặc 17.x tùy thời điểm)
          chmod +x ../bin/get-sdk.sh
          ../bin/get-sdk.sh iphoneos
          
          # Kiểm tra xem SDK đã về chưa
          if ls *.sdk >/dev/null 2>&1; then
             echo "✅ SDK Installed successfully:"
             ls -la
          else
             echo "❌ Failed to download SDK automatically."
             exit 1
          fi

      - name: Build Package
        run: |
          if [ ! -f Makefile ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          
          # Clean cache cũ
          rm -rf packages/ obj/ .theos/
          
          # Bắt đầu build
          # Lưu ý: Không cần set env THEOS nữa vì đã export ở Step 1
          make clean package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyRootlessTweak.deb
          path: packages/*.deb
