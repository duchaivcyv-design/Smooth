name: Build Rootless Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm nút Run Manual

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools & Theos
        run: |
          brew install make ldid dpkg wget
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          # Tải SDK iOS 16 (nhẹ và đủ dùng)
          wget -q https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz
          tar xf iPhoneOS16.5.sdk.tar.xz

      - name: Build Package
        env:
          THEOS: /opt/theos
          THEOS_PACKAGE_SCHEME: rootless # Quan trọng: Biến thành rootless
        run: |
          # Sửa Makefile nếu chưa có target rootless
          if [ ! -f Makefile ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          
          make clean package FINALPACKAGE=1

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: MyRootlessTweak.deb
          path: packages/*.deb
