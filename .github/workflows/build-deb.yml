name: Build Rootless Deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos
  PACKAGE_NAME: boostkit
  VERSION: 1.0.0

jobs:
  build-rootless-deb:
    name: Build Rootless Deb
    runs-on: macos-latest
    
    steps:
      # ============================
      # Bước 1: Cài đặt môi trường
      # ============================
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install dpkg ldid make wget curl git xz
      
      - name: Setup Theos (rootless)
        run: |
          sudo mkdir -p /opt
          sudo chown $(whoami):staff /opt
          
          # Clone Theos from GitHub
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # Set environment variables
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          
          echo "✅ Theos installed at $THEOS"

      - name: Download iOS SDKs
        run: |
          mkdir -p $THEOS/sdks
          
          # Download SDK iOS 16.5 (phổ biến nhất cho rootless)
          cd $THEOS/sdks
          
          echo "📥 Downloading iPhoneOS.sdk (iOS 16.5)..."
          wget -q https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz
          tar xf iPhoneOS*.sdk.tar.xz
          rm -f *.tar.xz
          
          echo "✅ Available SDKs:"
          ls -la $THEOS/sdks/

      # ============================
      # Bước 2: Build project
      # ============================
      - name: Verify build environment
        run: |
          echo "🔍 Checking environment..."
          echo "THEOS = $THEOS"
          echo "SCHEME = $THEOS_PACKAGE_SCHEME"
          which $THEOS/bin/make || echo "make not in theos bin"
          which ldid && ldid -h 2>&1 | head -3 || true
          which dpkg-deb && dpkg-deb --version | head -1
          ls $THEOS/sdks/
      
      - name: Create rootless directory structure
        run: |
          # Tạo cấu trúc thư mục rootless chuẩn
          mkdir -p rootfs/Library/Tweaks
          mkdir -p rootfs/var/jb/Applications
          
          # Copy files từ src/ hoặc trực tiếp
          if [ -d "src" ]; then
            echo "📂 Found src/ directory"
          fi
          
          # Nếu có binary/dylib sẵn thì copy vào
          if [ -d "payload" ]; then
            cp -r payload/* rootfs/
            echo "📦 Copied payload to rootfs"
          fi

      - name: Build with Theos
        run: |
          export THEOS=/opt/theos
          export PATH="$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=rootless
          
          # Kiểm tra có Makefile không
          if [ ! -f Makefile ]; then
            echo "⚠️ No Makefile found, creating default one..."
            cat > Makefile << 'MAKEFILE'
ARCHS = arm64 arm64e
TARGET := iphone:clang:latest:15.0
INSTALL_TARGET_PROCESSES = SpringBoard

include $(THEOS)/makefiles/common.mk

TWEAK_NAME = boostkit
boostkit_FILES = $(wildcard src/*.m src/*.mm src/*.c src/*.swift)
boostkit_CFLAGS = -fobjc-arc -Wno-deprecated-declarations
boostkit_FRAMEWORKS = UIKit Foundation CoreGraphics
boostkit_PRIVATE_FRAMEWORKS = AppSupport
boostkit_LIBRARIES = substrate

include $(THEOS_MAKE_PATH)/tweak.mk

after-install::
	install.exec "sbreload"
MAKEFILE
          fi
          
          # Clean cũ
          make clean 2>/dev/null || true
          
          # Build!
          echo "🔨 Building rootless deb..."
          make package FINALPACKAGE=1
          
          echo "✅ Build complete!"
        env:
          THEOS: /opt/theos
          THEOS_PACKAGE_SCHEME: rootless

      # ============================
      # Bước 3: Xử lý output
      # ============================
      - name: Find and rename deb package
        run: |
          # Tìm file .deb được generate
          DEB_FILE=$(find . -name "*.deb" -type f | head -1)
          
          if [ -z "$DEB_FILE" ]; then
            echo "❌ No .deb file found!"
            exit 1
          fi
          
          echo "📦 Found: $DEB_FILE"
          
          # Đổi tên theo format chuẩn
          NEW_NAME="${{ env.PACKAGE_NAME }}_${{ env.VERSION }}_iphoneos-arm64.deb"
          cp "$DEB_FILE" "./$NEW_NAME"
          
          # Hiển thị thông tin package
          echo "━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Package Info:"
          dpkg-deb --info "./$NEW_NAME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📁 Contents:"
          dpkg-deb --contents "./$NEW_NAME" | head -30
          echo "━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Lưu path cho step sau
          echo "DEB_PATH=./$NEW_NAME" >> $GITHUB_ENV
          echo "DEB_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: Sign the deb (optional - ad-hoc sign binaries)
        run: |
          # Tách deb ra để sign các dylib bên trong
          mkdir -p tmp_extract
          dpkg-deb -R "${{ env.DEB_PATH }}" tmp_extract/
          
          # Sign tất cả Mach-O binaries
          find tmp_extract/ -name "*.dylib" -o -name "*.bundle" | while read FILE; do
            if file "$FILE" | grep -q "Mach-O"; then
              echo "🔏 Signing: $FILE"
              ldid -S "$FILE" 2>/dev/null || true
            fi
          done
          
          # Rebuild deb
          dpkg-deb -b tmp_extract/ "${{ env.DEB_PATH }}" 
          rm -rf tmp_extract/
          
          echo "✅ Signed and rebuilt: ${{ env.DEB_NAME }}"

      - name: Calculate checksum
        run: |
          sha256sum "${{ env.DEB_PATH }}" > "${{ env.DEB_PATH }}.sha256"
          echo "🔢 SHA256: $(cat ${{ env.DEB_PATH }}.sha256)"

      # ============================
      # Bước 4: Upload artifacts
      # ============================
      - name: Upload deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootless-deb-${{ github.sha }}
          path: |
            ${{ env.DEB_PATH }}
            ${{ env.DEB_PATH }}.sha256
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`${{ env.DEB_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Size** | \`$(du -h ${{ env.DEB_PATH }} | cut -f1)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA256** | \`$(cut -d' ' -f1 ${{ env.DEB_PATH }}.sha256)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Scheme** | rootless |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
