name: Create Release & Update Repo

on:
  push:
    tags:
      - 'v*'           # Trigger khi push tag như v1.0.0, v1.0.1...
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pages: write

env:
  THEOS: /opt/theos
  REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  # =============================================
  # JOB 1: Build và tạo Release
  # =============================================
  build-and-release:
    name: Build & Create Release
    runs-on: macos-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          echo "TAG=v$VER" >> $GITHUB_OUTPUT
          echo "📌 Version: $VER"

      - name: Install dependencies
        run: |
          brew install dpkg ldid make wget curl git xz

      - name: Setup Theos (rootless)
        run: |
          sudo mkdir -p /opt
          sudo chown $(whoami):staff /opt
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Download iOS SDKs
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          wget -q https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz
          tar xf iPhoneOS*.sdk.tar.xz
          rm -f *.tar.xz
          echo "✅ SDK ready: $(ls $THEOS/sdks/)"

      - name: Build rootless deb
        run: |
          export THEOS=/opt/theos
          export PATH="$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=rootless
          
          # Cập nhật version trong control file
          sed -i.bak "s/^Version:.*/Version: ${{ steps.version.outputs.VERSION }}/" DEBIAN/control
          
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1
          
          echo "✅ Build done"

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          
          # Copy all .deb files
          find packages/ -name "*.deb" -exec cp {} release_assets/ \; 2>/dev/null || \
          find . -maxdepth 2 -name "*.deb" -exec cp {} release_assets/ \;
          
          # Sign binaries inside debs
          for DEB in release_assets/*.deb; do
            echo "🔏 Processing: $(basename $DEB)"
            
            TMPDIR="tmp_$(basename $DEB .deb)"
            dpkg-deb -R "$DEB" "$TMPDIR/"
            
            # Sign Mach-O files
            find "$TMPDIR/" \( -name "*.dylib" -o -name "*.bundle" \) | while read F; do
              if file "$F" | grep -q "Mach-O"; then
                ldid -S "$F" 2>/dev/null || true
                echo "  Signed: $(basename $F)"
              fi
            done
            
            # Rebuild
            dpkg-deb -b "$TMPDIR/" "$DEB"
            rm -rf "$TMPDIR/"
          done
          
          # Generate checksums
          cd release_assets
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          cd ..
          
          echo "📦 Release assets:"
          ls -lah release_assets/

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          
          # Escape cho multiline
          LOG_ESCAPED=$(echo "$LOG" | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "# 🚀 Release v${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Changes" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Installation" >> $GITHUB_OUTPUT
          echo "\`\`\`" >> $GITHUB_OUTPUT
          echo "Repo URL: $REPO_URL/repo" >> $GITHUB_OUTPUT
          echo "Package: com.yourname.boostkit" >> $GITHUB_OUTPUT
          echo "\`\`\`" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "BoostKit v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
          files: |
            release_assets/*.deb
            release_assets/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =============================================
  # JOB 2: Cập nhật APT Repository (GitHub Pages)
  # =============================================
  update-repo:
    name: Update APT Repository
    runs-on: ubuntu-latest
    needs: build-and-release
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo-page
          fetch-depth: 0
      
      - name: Download release assets
        run: |
          mkdir -p downloads
          
          TAG="${{ needs.build-and-release.result }}"
          # Lấy từ release vừa tạo
          VERSION_TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "latest")
          
          # Dùng GitHub API download
          RELEASE_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          
          # Extract deb URLs và download
          echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url' | while read URL; do
            FILENAME=$(basename "$URL")
            echo "📥 Downloading: $FILENAME"
            curl -sL -o "downloads/$FILENAME" "$URL"
          done
          
          ls -lah downloads/

      - name: Update repository index
        run: |
          cd repo-page
          
          # Ensure directories exist
          mkdir -p pool/main bionic/main
          
          # Copy new debs into pool
          cp ../downloads/*.deb pool/main/ 2>/dev/null || true
          
          # Generate Packages file
          apt-ftparchive packages pool/main/ > dists/bionic/main/binary-iphoneos-arm64/Packages 2>/dev/null || {
            # Fallback: manual generation
            mkdir -p dists/bionic/main/binary-iphoneos-arm64
            cd pool/main
            for DEB in *.deb; do
              echo "Package: $(dpkg-deb --field $DEB Package)"
              echo "Version: $(dpkg-deb --field $DEB Version)"
              echo "Architecture: $(dpkg-deb --field $DEB Architecture)"
              echo "Maintainer: $(dpkg-deb --field $DEB Maintainer)"
              echo "Installed-Size: $(dpkg-deb --field $DEB Installed-Size)"
              echo "Filename: pool/main/$DEB"
              SIZE=$(stat -c%s "$DEB")
              MD5=$(md5sum "$DEB" | awk '{print $1}')
              SHA1=$(sha1sum "$DEB" | awk '{print $1}')
              SHA256=$(sha256sum "$DEB" | awk '{print $1}')
              echo "Size: $SIZE"
              echo "MD5sum: $MD5"
              echo "SHA1: $SHA1"
              echo "SHA256: $SHA256"
              echo "Description: $(dpkg-deb --field $DEB Description)"
              echo "Section: $(dpkg-deb --field $DEB Section)"
              echo ""
            done > ../../dists/bionic/main/binary-iphoneos-arm64/Packages
            cd ../../
          }
          
          # Compress Packages
          gzip -kf dists/bionic/main/binary-iphoneos-arm64/Packages
          
          # Generate Release file
          DIST_DIR=dists/bionic
          PKGS_FILE=$DIST_DIR/main/binary-iphoneos-arm64/Packages
          PKGS_GZ=${PKGS_FILE}.gz
          
          cat > $DIST_DIR/Release << EOF
Origin: WormGPT Repo
Label: BoostKit Repository
Suite: bionic
Version: 1.0
Codename: bionic
Architectures: iphoneos-arm64
Components: main
Description: Rootless tweaks for iOS 15-16
Date: $(date -Ru)
EOF
          
          # Add file hashes to Release
          for FILE in $PKGS_FILE $PKGS_GZ; do
            BASENAME=$(basename $FILE)
            RELATIVE=$(realpath --relative-to=$DIST_DIR $FILE)
            SIZE=$(stat -c%s "$FILE")
            MD5=$(md5sum "$FILE" | awk '{print $1}')
            SHA256=$(sha256sum "$FILE" | awk '{print $1}')
            
            printf "%s:\n" "$(dirname $RELATIVE)" >> /dev/null  # skip dir header for simplicity
            echo " $MD5 $(printf '%*s' $((${#SHA256}-1)) '')$(($SIZE)) $RELATIVE" >> $DIST_DIR/Release.tmp.$BASENAME.md5
          done
          
          # Simpler approach - just append hashes
          {
            echo ""
            echo "MD5Sum:"
            echo " $(md5sum $PKGS_FILE | awk '{print $1}') $(stat -c%s $PKGS_FILE) main/binary-iphoneos-arm64/Packages"
            echo " $(md5sum $PKGS_GZ | awk '{print $1}') $(stat -c%s $PKGS_GZ) main/binary-iphoneos-arm64/Packages.gz"
            echo "SHA256:"
            echo " $(sha256sum $PKGS_FILE | awk '{print $1}') $(stat -c%s $PKGS_FILE) main/binary-iphoneos-arm64/Packages"
            echo " $(sha256sum $PKGS_GZ | awk '{print $1}') $(stat -c%s $PKGS_GZ) main/binary-iphoneos-arm64/Packages.gz"
          } >> $DIST_DIR/Release
          
          # Create Cydia JSON (for Sileo/Cydia compatibility)
          cat > cydia.json << 'CJEOF'
{
  "data": [
    {
      "author": "Your Name",
      "category": "Tweaks",
      "depiction": "https://tuangpt.top/depiction.html",
      "icon": "https://via.placeholder.com/55",
      "id": "com.yourname.boostkit",
      "name": "BoostKit",
      "section": "Tweaks",
      "version": "LATEST"
    }
  ],
  "min_version": "1.1.0",
  "name": "BoostKit Repository",
  "source": "REPO_URL_PLACEHOLDER",
  "url": "REPO_URL_PLACEHOLDER"
}
CJEOF
          
          # Replace placeholders
          sed -i "s|REPO_URL_PLACEHOLDER|$REPO_URL/repo|g" cydia.json
          
          # Index page
          cat > index.html << 'HTMLEOF'
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BoostKit Repository</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #e94560; }
    a.cytyle { display: inline-block; padding: 12px 24px; background: #e94560; color: white; text-decoration: none; border-radius: 8px; margin: 5px; }
    .repo-url { background: #16213e; padding: 15px; border-radius: 8px; word-break: break-all; margin: 15px 0; }
  </style>
</head>
<body>
  <h1>🐛 BoostKit Repository</h1>
  <p>Rootless tweaks for iOS 15-16</p>
  
  <div class="repo-url">
    <strong>Repo URL:</strong><br>
    <code id="repoUrl"></code>
  </div>
  
  <a class="cytile" href="" id="addCydia">Add to Cydia</a>
  <a class="cytile" href="" id="addSileo">Add to Sileo</a>
  <a class="cytile" href="" id="addZeppelin">Add to Zebra</a>
  
  <script>
    const repo = window.location.origin + '/repo';
    document.getElementById('repoUrl').textContent = repo;
    document.getElementById('addCydia').href = 'cydia://url/' + encodeURIComponent(repo);
    document.getElementById('addSileo').href = 'sileo://source/' + encodeURIComponent(repo);
    document.getElementById('addZeppelin').href = 'zebra://add-source/' + encodeURIComponent(repo);
  </script>
</body>
</html>
HTMLEOF
          
          cd ..

      - name: Commit and push to gh-pages
        run: |
          cd repo-page
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "📦 Auto-update repo - ${{ github.sha }}" || echo "No changes"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
