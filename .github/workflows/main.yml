name: build deb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheme:
        description: "scheme"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - rootless
          - rootful
          - roothide

# Tự động hủy ngay các bản build cũ đang bị kẹt hàng đợi khi bạn lưu code mới
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ github.event.inputs.scheme || 'all' }})
    runs-on: macos-14

    env:
      DEVICE_TARGET: "iphone:clang:16.5:14.0"
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos (roothide/theos)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          curl -sLO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf master.zip sdks-master

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: install deps (Fast Mode)
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Pre-check & Static Code Lint (Quét lỗi cú pháp trước khi Build)
        run: |
          echo "=== Đang quét lỗi cú pháp mã nguồn C/Obj-C ==="
          find . -name "*.m" -o -name "*.mm" | while read file; do
            echo "Linting: $file"
            clang -fsyntax-only -fobjc-arc -IHeaders -I. "$file" || true
          done
          echo "=== Hoàn tất quét sơ bộ ==="

      - name: build rootless
        if: ${{ github.event.inputs.scheme == '' || github.event.inputs.scheme == 'all' || github.event.inputs.scheme == 'rootless' }}
        run: |
          mkdir -p ./all-packages/rootless
          make clean
          set -o pipefail
          make package -j$(sysctl -n hw.ncpu) \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build_rootless.log || {
              echo "======================================================="
              echo " [LỖI BIÊN DỊCH ROOTLESS] - CHI TIẾT LỖI VÀ DÒNG CODE:"
              echo "======================================================="
              cat build_rootless.log
              exit 1
            }
          mv packages/*.deb ./all-packages/rootless/
          rm -rf packages .theos build_rootless.log

      - name: build rootful
        if: ${{ github.event.inputs.scheme == '' || github.event.inputs.scheme == 'all' || github.event.inputs.scheme == 'rootful' }}
        run: |
          mkdir -p ./all-packages/rootful
          make clean
          set -o pipefail
          make package -j$(sysctl -n hw.ncpu) \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 2>&1 | tee build_rootful.log || {
              echo "======================================================="
              echo " [LỖI BIÊN DỊCH ROOTFUL] - CHI TIẾT LỖI VÀ DÒNG CODE:"
              echo "======================================================="
              cat build_rootful.log
              exit 1
            }
          mv packages/*.deb ./all-packages/rootful/
          rm -rf packages .theos build_rootful.log

      - name: build roothide
        if: ${{ github.event.inputs.scheme == '' || github.event.inputs.scheme == 'all' || github.event.inputs.scheme == 'roothide' }}
        run: |
          mkdir -p ./all-packages/roothide
          make clean
          set -o pipefail
          make package -j$(sysctl -n hw.ncpu) \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build_roothide.log || {
              echo "======================================================="
              echo " [LỖI BIÊN DỊCH ROOTHIDE] - CHI TIẾT LỖI VÀ DÒNG CODE:"
              echo "======================================================="
              cat build_roothide.log
              exit 1
            }
          mv packages/*.deb ./all-packages/roothide/
          rm -rf packages .theos build_roothide.log

      - name: upload rootless-package
        if: ${{ github.event.inputs.scheme == '' || github.event.inputs.scheme == 'all' || github.event.inputs.scheme == 'rootless' }}
        uses: actions/upload-artifact@v4
        with:
          name: rootless-package
          path: ./all-packages/rootless/*.deb

      - name: upload rootful-package
        if: ${{ github.event.inputs.scheme == '' || github.event.inputs.scheme == 'all' || github.event.inputs.scheme == 'rootful' }}
        uses: actions/upload-artifact@v4
        with:
          name: rootful-package
          path: ./all-packages/rootful/*.deb

      - name: upload roothide-package
        if: ${{ github.event.inputs.scheme == '' || github.event.inputs.scheme == 'all' || github.event.inputs.scheme == 'roothide' }}
        uses: actions/upload-artifact@v4
        with:
          name: roothide-package
          path: ./all-packages/roothide/*.deb

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-packages
          pattern: "*-package"
          merge-multiple: true

      - name: update nightly release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./all-packages/*.deb"
          allowUpdates: true
          tag: nightly
          name: "Nightly"
          body: |
            This build was automatically generated from the latest commit on `main`.
            
            **Commit SHA:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}
            
            > [!NOTE]
            > A nightly build is basically the next update partially done. Additionally, this build might have the old version number but the code itself should has the latest commit.
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
